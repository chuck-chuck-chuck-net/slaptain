contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - wolfi-base
    - openldap
    - openldap-back-mdb
    - openldap-clients
    - tzdata

accounts:
  groups:
    - groupname: openldap
      gid: 1024
  users:
    - username: openldap
      uid: 1024
      gid: 1024
  run-as: 1024

paths:
  - path: /etc/openldap/slapd.d
    type: directory
    uid: 1024
    gid: 1024
    permissions: 0755
  - path: /var/lib/openldap/openldap-data
    type: directory
    uid: 1024
    gid: 1024
    permissions: 0755

entrypoint:
  command: /usr/sbin/slapd
