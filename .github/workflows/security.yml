name: Security scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 8 * * 1'  # Every Monday at 08:00 UTC

permissions:
  contents: read
  security-events: write

# A new push to a PR cancels the run it replaces. Every other event gets a
# group of its own, so runs on main never wait for or cancel one another.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  govulncheck:
    name: Go vulnerability check
    runs-on: namespace-profile-2x8
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The modules declare the same Go version, and the toolchain decides
      # which stdlib findings apply, so it comes from go.mod and not 'stable'.
      # golang/govulncheck-action is not used: its setup-go restored a 400 MB
      # GitHub cache tarball and it installed govulncheck@latest on every run.
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: operator/go.mod
          cache: false

      - name: Go cache on the Namespace cache volume
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          cache: go

      # `go run` keeps the built binary in the Go build cache, so a pinned
      # version compiles once per volume. Every module is scanned even when an
      # earlier one has findings.
      - name: Run govulncheck
        env:
          GOVULNCHECK_VERSION: v1.9.0
        run: |
          rc=0
          for module in operator exporter tests/e2e; do
            echo "::group::govulncheck ${module}"
            (cd "${module}" && go run "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}" ./...) || rc=1
            echo "::endgroup::"
          done
          exit "${rc}"

  trivy:
    name: Trivy filesystem scan
    runs-on: namespace-profile-1x2
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Upload results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('trivy.sarif') != ''
        with:
          sarif_file: trivy.sarif
