name: e2e slow

# Labelling a pull request "e2e slow" starts e2e.yml's slow tier against that
# pull request's head commit. The label is removed straight away, so adding it
# again starts another run: it works like a button.

on:
  pull_request:
    types: [labeled]

permissions: {}

jobs:
  start:
    name: Start the slow e2e tier
    # A fork's pull request gets no dev images (publish-dev.yml) and a read-only token.
    if: >-
      github.event.label.name == 'e2e slow' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      actions: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      BRANCH: ${{ github.head_ref }}
      SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Remove the label
        run: gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --remove-label "e2e slow"

      # The images are tagged by branch, so wait until this commit's are the ones pushed.
      - name: Wait for this commit's dev images
        run: |
          for i in $(seq 1 160); do
            runs=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow publish-dev.yml \
              --commit "$SHA" --json databaseId,status)
            for id in $(jq -r '.[] | select(.status == "completed") | .databaseId' <<<"$runs"); do
              built=$(gh run view "$id" --repo "$GITHUB_REPOSITORY" --json jobs --jq \
                '[.jobs[] | select(.name | startswith("Build and push")) | .conclusion]
                 | length > 0 and all(. == "success")')
              [ "$built" = true ] && exit 0
            done
            if [ "$i" -gt 4 ] && ! jq -e 'any(.[]; .status != "completed")' <<<"$runs" >/dev/null; then
              echo "::error::No publish-dev run built images for $SHA. Is the pull request labelled dev images?"
              exit 1
            fi
            sleep 30
          done
          echo "::error::Timed out waiting for the dev images of $SHA"
          exit 1

      - name: Start the slow tier
        run: |
          gh workflow run e2e.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$BRANCH" \
            -f tier=slow \
            -f ref="$SHA" \
            -f branch="$BRANCH"
