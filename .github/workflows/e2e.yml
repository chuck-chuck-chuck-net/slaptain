name: e2e

# The e2e suite on a single-site kind cluster, against the dev images a pull
# request's publish-dev run has just pushed (ADR-046). publish-dev.yml starts it
# once every image job has finished, so the images it pulls are this commit's.
# Its own workflow, so its result is reported as e2e, and no concurrency group,
# so a new push never cancels a run in progress.

on:
  workflow_dispatch:
    inputs:
      tier:
        description: smoke runs on every labelled push; slow runs what smoke leaves out
        required: true
        type: choice
        options: [smoke, slow]
        default: smoke
      ref:
        description: Commit to test, the one the images were built from (default the branch head)
        required: false
        type: string
      branch:
        description: Branch the images are tagged after (default the branch this runs on)
        required: false
        type: string

run-name: e2e ${{ inputs.tier }} ${{ inputs.branch || github.ref_name }} @ ${{ inputs.ref || github.sha }}

permissions:
  contents: read

jobs:
  e2e:
    name: e2e (${{ inputs.tier }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.tier == 'slow' && 180 || 45 }}
    env:
      KUBE_CONTEXT: kind-slaptain
      # Specs that roll, restart or mutate the cluster for minutes, or are flaky for now.
      # The smoke tier leaves them out and the slow tier runs them.
      SLOW_LABELS: >-
        cleanup-policy || scale-topology || database-hotadd || write-rotation ||
        purge-rotation || image-selector || monitor-at-rest || startup-config ||
        tls-gate || monitor
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Address the dev images and select the tier
        env:
          BRANCH: ${{ inputs.branch || github.ref_name }}
          TIER: ${{ inputs.tier }}
        run: |
          slug=$(scripts/branch-slug.sh "$BRANCH")
          {
            echo "REGISTRY=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/dev"
            echo "IMAGE_TAG=$slug"
            echo "EXPORTER_IMAGE_TAG=$slug"
            echo "E2E_SEED=$(date +%s)"
            if [ "$TIER" = slow ]; then
              # The env-gated groups need only one cluster; external replication needs two.
              echo "E2E_LABEL_FILTER=$SLOW_LABELS || backup || restore || scale || scaleup"
              echo "E2E_BACKUP=1"
              echo "E2E_SCALE=1"
              echo "E2E_SCALEUP=1"
              echo "FAIL_FAST=0"
            else
              echo "E2E_LABEL_FILTER=!($SLOW_LABELS)"
              echo "FAIL_FAST=1"
            fi
          } | tee -a "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: tests/e2e/go.mod
          cache-dependency-path: |
            tests/e2e/go.sum
            operator/go.sum

      - name: Create the kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: slaptain

      - name: Record the spec-order seed
        run: echo "Ginkgo seed \`$E2E_SEED\`, replay with \`E2E_SEED=$E2E_SEED\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy the operator and the fixture
        run: tests/e2e.sh setup "$KUBE_CONTEXT"

      - name: Run the specs
        run: tests/e2e.sh test "$KUBE_CONTEXT"

      - name: Collect cluster state
        if: failure()
        run: |
          mkdir -p e2e-debug
          kubectl --context "$KUBE_CONTEXT" get pods -A -o wide > e2e-debug/pods.txt || true
          kubectl --context "$KUBE_CONTEXT" get events -A --sort-by=.lastTimestamp > e2e-debug/events.txt || true
          kubectl --context "$KUBE_CONTEXT" -n slaptain-system logs deploy/slaptain --all-containers > e2e-debug/operator.log || true
          make build-slctl
          (cd e2e-debug && ../bin/slctl --context "$KUBE_CONTEXT" debug-dump -n slaptain-testing slapd) || true
          kind export logs --name slaptain e2e-debug/kind || true

      - name: Upload cluster state
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-debug
          path: e2e-debug/
          retention-days: 7
