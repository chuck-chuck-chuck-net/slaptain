name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 8 * * 1'  # Every Monday at 08:00 UTC

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: operator/go.mod
          cache-dependency-path: |
            operator/go.sum
            tests/e2e/go.sum

      # build-mode none: the Go extractor resolves both modules (operator/,
      # tests/e2e/) itself, so no autobuild has to guess which go.mod to build
      # from — the repo root has none.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: go
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
