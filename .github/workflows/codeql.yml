name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 8 * * 1'  # Every Monday at 08:00 UTC

permissions:
  contents: read
  security-events: write

# A new push to a PR cancels the run it replaces. Every other event gets a
# group of its own, so runs on main never wait for or cancel one another.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    # Measured: 1.6 of 4 cores on average, near 4 only for ~40 s of queries;
    # 8x16 finished 10 s sooner, so the extra 4 vCPU of quota bought little.
    runs-on: namespace-profile-4x8
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: operator/go.mod
          cache: false

      - name: Go cache on the Namespace cache volume
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          cache: go

      # Go has no "none" build mode ("Go does not support the none build
      # mode", CodeQL 2.27). The Go autobuilder finds every go.mod in the tree
      # and builds each module (operator/, tests/e2e/) — the repo root has none.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: go

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      # The database upload only feeds variant analysis, and waiting for
      # processing only reports what the Security tab shows anyway.
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          upload-database: false
          wait-for-processing: false
