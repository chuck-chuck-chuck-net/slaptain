name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 8 * * 1'  # Every Monday at 08:00 UTC

permissions:
  contents: read
  security-events: write

# A new push to a PR cancels the run it replaces. Every other event gets a
# group of its own, so runs on main never wait for or cancel one another.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: operator/go.mod
          cache: false

      # Go has no "none" build mode ("Go does not support the none build
      # mode", CodeQL 2.27). Autobuild is no substitute: it runs `make` first,
      # whose default target bakes every container image. tests/e2e holds only
      # _test.go files, which `go build` skips.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: go
          build-mode: manual

      - name: Build the Go modules
        run: |
          for module in operator exporter; do
            (cd "$module" && go build ./...)
          done

      # The database upload only feeds variant analysis, and waiting for
      # processing only reports what the Security tab shows anyway.
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          upload-database: false
          wait-for-processing: false
