name: Publish main

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**.md'

permissions:
  contents: read
  packages: write

jobs:
  images:
    name: Build and push images (${{ matrix.group }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        group: [publish-pure, publish-slaptain, publish-ol26src, publish-other]
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Every image name and tag comes from scripts/bake-vars.sh, which derives
      # them the way the Makefile does (docs/VERSIONING.md).
      - name: Derive the image tags
        run: scripts/bake-vars.sh | tee -a "$GITHUB_ENV"

      # The bake file defaults REGISTRY to the upstream owner; a fork publishes
      # under its own, lowercased because OCI repository names must be.
      - name: Point REGISTRY at the repository owner
        run: echo "REGISTRY=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      # The runner's default docker driver cannot export a build cache; a
      # docker-container builder can.
      - name: Set up buildx
        uses: docker/setup-buildx-action@v4

      # Each job builds one group of docker-bake.hcl's eleven images.
      - name: Build and push the images
        env:
          GROUP: ${{ matrix.group }}
        run: docker buildx bake --push "$GROUP"
