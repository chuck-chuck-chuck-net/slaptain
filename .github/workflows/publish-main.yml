name: Publish main

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**.md'

permissions:
  contents: read
  packages: write

env:
  # The Makefile defaults REGISTRY to the upstream owner; a fork publishes
  # under its own.
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  images:
    name: Build and push images
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Every image name and tag comes from the Makefile (GIT_TAG → IMAGE_TAG,
      # docs/VERSIONING.md), so CI reuses it instead of re-deriving the rule
      # with docker/metadata-action. Off a version tag that is sha-<short
      # hash> — the same spelling metadata-action's type=sha publishes for the
      # sibling project, so `make`, tests/e2e.sh and CI agree on the name.
      #
      # `make push` builds the OpenLDAP .deb carrier once and feeds it to both
      # 2.7 images. The carrier is pushed too, as a build input: a remote
      # BuildKit worker has no local image store to resolve it from, and one
      # build graph across every substrate is worth more than not publishing it.
      - name: Show the tag the Makefile derived
        run: make show-tag

      # buildx on a GitHub runner is a docker CLI plugin, not a binary on PATH,
      # so the Makefile's BUILDX is pointed at it below. The build itself runs
      # in BuildKit and pushes directly -- there is no local image store and no
      # separate push step (see the Makefile's build driver block).
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the images
        run: make push
        env:
          BUILDX: docker buildx
          BUILD_CACHE_FLAGS: --cache-from type=gha --cache-to type=gha,mode=max
