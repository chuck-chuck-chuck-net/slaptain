name: Lint

# push is limited to main: a PR branch is covered by the pull_request event,
# and running both doubles every check.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a PR cancels the run it replaces. Every other event gets a
# group of its own, so runs on main never wait for or cancel one another.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    name: golangci-lint
    # On 2x8 the operator lint took 182-231 s against 103 s on 4x8; its bursts
    # use every core, which a 1.7-core average hid.
    runs-on: namespace-profile-4x8
    steps:
      - name: Clone the code
        uses: actions/checkout@v7

      # The modules that ship code declare the same Go version; the operator's is used here.
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: operator/go.mod
          cache: false

      # The volume's golangci-lint mode asks the binary where its cache lives,
      # so the binary has to be on PATH before the volume is mounted.
      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          install-only: true
          skip-cache: true

      # golangci-lint keeps its analysis cache on the volume too. The action's own cache is
      # skipped: it saves nothing once its key hits, so it stayed at whatever the first run wrote.
      - name: Go and golangci-lint caches on the Namespace cache volume
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          cache: |
            go
            golangci-lint

      # `version` (here and in the install step) is the same pin as GOLANGCI_LINT_VERSION in operator/Makefile;
      # move them together, so `make -C operator lint` and CI judge by the same
      # rules. (It has to be a release whose Go is at least the module's go.mod,
      # or it dies on the export-data version before any linter runs — the
      # failure docs/BACKLOG.md records for v2.7.2 under Go 1.27.)
      #
      # The gate is "have none": every finding in the module fails it, not only
      # the ones a change introduces. Both modules are at zero (the lint-debt
      # entry in docs/BACKLOG.md). The earlier only-new-issues mode read the PR
      # diff through the API, which refuses diffs over 20,000 lines, and then
      # fell back to linting everything anyway.
      #
      # Each module carries its own .golangci.yml (identical today). tests/e2e
      # is compiled by the test workflow.
      - name: Lint the operator
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: operator
          skip-cache: true

      - name: Lint the exporter
        if: ${{ !cancelled() }}
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: exporter
          skip-cache: true

  chart:
    name: Helm charts
    runs-on: namespace-profile-1x2
    steps:
      - name: Clone the code
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5

      # A template-syntax error in a chart is invisible to the Go gates and
      # only surfaces at `helm install` time on the user's cluster. All four
      # published charts, each rendered in the shapes people actually install.
      - name: Lint and render the charts
        run: make helm-lint
