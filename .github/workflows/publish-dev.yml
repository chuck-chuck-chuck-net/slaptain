name: Publish dev

# Images for a pull request labelled "dev images" (ADR-046), pushed to
# ghcr.io/<owner>/dev and tagged with the branch name, so every push replaces the
# last build. Removing the label stops the builds; cleanup-dev.yml deletes the images.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read
  packages: write

jobs:
  images:
    name: Build and push dev images (${{ matrix.group }})
    # A fork's pull request gets a read-only token and could not push. Adding some
    # other label to a labelled pull request is no reason to rebuild.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'dev images') &&
      (github.event.action != 'labeled' || github.event.label.name == 'dev images')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      matrix:
        group: [publish-pure, publish-slaptain, publish-ol26src, publish-other]
    # Job-level, so a run whose job is skipped cannot cancel a build in progress.
    # The matrix group is in the key, or the four jobs would cancel each other.
    concurrency:
      group: publish-dev-${{ github.event.pull_request.number }}-${{ matrix.group }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The branch as pushed, not the merge commit GitHub would check out.
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Derive the image tags
        run: scripts/bake-vars.sh | tee -a "$GITHUB_ENV"

      # Later lines in GITHUB_ENV win, so these replace the derived TAG and EXPORTER_TAG.
      - name: Tag with the branch name, under the dev path
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          slug=$(scripts/branch-slug.sh "$HEAD_REF")
          {
            echo "TAG=$slug"
            echo "EXPORTER_TAG=$slug"
            echo "REGISTRY=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/dev"
          } | tee -a "$GITHUB_ENV"

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Set up buildx
        uses: docker/setup-buildx-action@v4

      # Hands the cache service's URL and token to the run steps, where the
      # bake step's gha cache needs them; they are not in a step's environment.
      - name: Expose the GitHub Actions cache to buildx
        uses: crazy-max/ghaction-github-runtime@v4

      - name: Build and push the images
        env:
          GROUP: ${{ matrix.group }}
          GHA_CACHE: '1'
        run: docker buildx bake --push "$GROUP"

  # The Nubus ldap-server targets for slaptain, from a copy of the ldap repository's
  # docker/ldap-server (branch jlohmer/nubus-slaptain). The init target copies bootstrap.sh
  # out of this push's slapd-init, hence the wait for the images job.
  nubus-ldap:
    name: Build and push the Nubus slapd images (${{ matrix.target }})
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        target: [slaptain-slapd, slaptain-init]
    concurrency:
      group: publish-dev-${{ github.event.pull_request.number }}-nubus-${{ matrix.target }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Derive the image names
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          slug=$(scripts/branch-slug.sh "$HEAD_REF")
          registry="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/dev"
          {
            echo "IMAGE=$registry/nubus/${{ matrix.target }}:$slug"
            echo "SLAPTAIN_INIT_IMAGE=$registry/slaptain/slapd-init:$slug-ol26"
          } | tee -a "$GITHUB_ENV"

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Set up buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        run: |
          docker buildx build --push \
            --target "${{ matrix.target }}" \
            --build-arg UCS_BASE_IMAGE=artifacts.software-univention.de/jlohmer-dev/images/ucs-base \
            --build-arg SLAPTAIN_INIT_IMAGE="$SLAPTAIN_INIT_IMAGE" \
            --tag "$IMAGE" \
            nubus/ldap-server
