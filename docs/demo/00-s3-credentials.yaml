# S3 credentials for the backup and restore steps. A Secret reference never
# crosses a namespace, so this lives next to the SlapdBackup. The values match
# the versitygw test fixture (tests/resources/versitygw.yaml); with a real
# bucket, put your own access key here.
apiVersion: v1
kind: Secret
metadata:
  name: s3-credentials
  namespace: slaptain-demo
  labels:
    ldap.chuck-chuck-chuck.net/cluster: slapd
type: Opaque
stringData:
  access-key-id: e2e-test-access
  secret-access-key: e2e-test-secret
