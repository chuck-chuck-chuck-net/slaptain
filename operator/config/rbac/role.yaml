---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - secrets
  - services
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - apps
  resources:
  - statefulsets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - batch
  resources:
  - jobs
  verbs:
  - create
  - delete
  - get
  - list
  - watch
- apiGroups:
  - ldap.chuck-chuck-chuck.net
  resources:
  - slapdbackups
  - slapdclusters
  - slapddatabases
  - slapdscheduledbackups
  - slapdschemas
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ldap.chuck-chuck-chuck.net
  resources:
  - slapdbackups/status
  - slapdclusters/status
  - slapddatabases/status
  - slapdmeshes/status
  - slapdrestores/status
  - slapdscheduledbackups/status
  - slapdschemas/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - ldap.chuck-chuck-chuck.net
  resources:
  - slapdclusters/finalizers
  - slapddatabases/finalizers
  - slapdschemas/finalizers
  verbs:
  - update
- apiGroups:
  - ldap.chuck-chuck-chuck.net
  resources:
  - slapdmeshes
  - slapdrestores
  verbs:
  - get
  - list
  - watch
