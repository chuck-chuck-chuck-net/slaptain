                    type: string
                  message:
                    description: message is a human-readable status detail (e.g. the
                      failure reason).
                    type: string
                  originalReadReplicas:
                    description: originalReadReplicas is spec.readReplicas captured
                      before scaling down.
                    format: int32
                    type: integer
                  originalReplicas:
                    description: originalReplicas is spec.replicas captured before
