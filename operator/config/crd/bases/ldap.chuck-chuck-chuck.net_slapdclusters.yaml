                > 0)'
            - message: replication.mode=consumer-only is incompatible with readReplicas>0
                (the whole cluster is already read-only)
              rule: '!has(self.replication) || self.replication.mode != ''consumer-only''
                || !has(self.readReplicas) || self.readReplicas == 0'
            - message: replication.mode=consumer-only requires replication.enabled=true
                (otherwise the mode is silently ignored)
              rule: '!has(self.replication) || self.replication.mode != ''consumer-only''
                || self.replication.enabled'
            - message: replication.externalPeers requires replication.enabled=true
                (otherwise the peers are silently ignored)
              rule: '!has(self.replication) || !has(self.replication.externalPeers)
                || size(self.replication.externalPeers) == 0 || self.replication.enabled'
          status:
            description: status defines the observed state of SlapdCluster.
            properties:
              conditions:
                description: conditions holds standard Kubernetes condition entries.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              externalPeerStatuses:
                description: externalPeerStatuses reports per-peer replication connectivity.
                items:
                  description: ExternalPeerStatus reports the observed replication
                    state of one external peer.
                  properties:
                    connected:
                      description: |-
                        connected indicates whether the operator can reach this peer.
                        Derived from replicationState: true when not Unreachable.
                      type: boolean
                    discoveredAddresses:
                      description: |-
                        discoveredAddresses lists Multus IPs discovered from the remote cluster's pods.
                        Only populated for peers using discovery mode. The SlapdDatabase controller
                        consumes these the same way as static podAddresses.
                      items:
                        type: string
                      type: array
                    lagSeconds:
                      description: |-
                        lagSeconds reports the max CSN timestamp delta between local and remote
                        as a decimal string (e.g. "3.2"). Only set when replicationState is Lagging.
                      type: string
                    lastChecked:
                      description: lastChecked is the time the CSN check last ran.
                      format: date-time
                      type: string
                    lastError:
                      description: lastError is the last connection or discovery error,
                        if any.
                      type: string
                    name:
                      description: name matches ExternalPeer.Name.
                      type: string
                    replicationState:
                      description: |-
                        replicationState reports the CSN convergence state of this peer.
                        Synced: remote CSN is within threshold of local CSN.
                        Lagging: remote CSN is behind local CSN by more than the threshold.
                        Unreachable: operator could not query contextCSN on any remote pod.
                      enum:
                      - Synced
                      - Lagging
                      - Unreachable
                      type: string
                  required:
                  - connected
                  - name
                  type: object
                type: array
              observedGeneration:
                description: observedGeneration is the .metadata.generation the controller
                  last reconciled.
                format: int64
                type: integer
              phase:
                description: phase summarises the current lifecycle state.
                type: string
              readOnlyReadyReplicas:
                description: readOnlyReadyReplicas is the number of read-only pods
                  reporting Ready.
                format: int32
                type: integer
              readOnlyReplicas:
                description: readOnlyReplicas is the total number of read-only pods
                  (ready or not).
                format: int32
                type: integer
              readyReplicas:
                description: readyReplicas is the number of pods reporting Ready.
                format: int32
                type: integer
              replicas:
                description: replicas is the total number of pods (ready or not).
                format: int32
                type: integer
              replicationMode:
                description: |-
                  replicationMode reflects the observed replication mode (ADR-010). Equals
                  spec.replication.mode in steady state; may lag spec briefly during an
                  in-place promotion or demotion (3d, not yet implemented).
                type: string
              replicationNetworkIPs:
                additionalProperties:
                  type: string
                description: |-
                  replicationNetworkIPs reports discovered Multus IPs per pod on the replication network.
                  Key: pod name, Value: IP address. Only populated when spec.replication.network is set.
                type: object
              restore:
                description: |-
                  restore tracks an in-progress bootstrapFrom restore (ADR-014). Nil when no
