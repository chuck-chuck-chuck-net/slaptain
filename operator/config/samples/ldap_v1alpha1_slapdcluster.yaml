apiVersion: ldap.chuck-chuck-chuck.net/v1alpha1
kind: SlapdCluster
metadata:
  name: slapd
spec:
  images:
    slapd:
      repository: registry.internal/slaptain/slapd
      tag: latest
      pullPolicy: Always
    init:
      repository: registry.internal/slaptain/slapd-init
      tag: latest
      pullPolicy: Always

  ldap:
    domain: "dc=example,dc=org"
    # credentialsSecretName: "my-ldap-credentials"  # optional; omit to auto-generate
    # When set, the Secret must contain admin-password and root-password keys:
    #   kubectl create secret generic my-ldap-credentials \
    #     --from-literal=admin-password=changeme \
    #     --from-literal=root-password=changeme
    forceRebootstrap: false
    tls:
      enabled: true
      secretName: slapd-tls
    # acls is an ordered list of slapd.conf "access to ..." rules applied to every pod's
    # cn=config by the operator (cn=config is not replicated; the operator targets each pod
    # individually via headless service DNS and self-heals after pod replacement).
    # Leave empty (or omit) to keep the init-container default ACLs:
    #   - userPassword: self write + anonymous auth only
    #   - everything else: read for all
    #
    # Example: restrict userPassword in ou=Mail to readpw accounts, hide it elsewhere.
    # acls:
    #   - 'to dn.subtree="ou=Mail,dc=example,dc=org" attrs=userPassword by self write by dn.children="ou=Readpw,dc=example,dc=org" read by anonymous auth by * none'
    #   - 'to attrs=userPassword by self write by anonymous auth by * none'
    #   - 'to attrs=shadowLastChange by self write by * read'
    #   - 'to * by * read'

  # Set replicas > 1 together with replication.enabled=true for N-way multi-master.
  replicas: 1
  logLevel: 0

  persistence:
    enabled: true
    config:
      size: 1Gi
      accessMode: ReadWriteOnce
      # storageClass: ""
    data:
      size: 5Gi
      accessMode: ReadWriteOnce
      # storageClass: ""
    # accesslog is only provisioned when replication.enabled=true.
    accesslog:
      size: 1Gi
      accessMode: ReadWriteOnce
      # storageClass: ""

  service:
    type: ClusterIP
    ldapPort: 389
    ldapsPort: 636

  # replication enables N-way multi-master delta-syncrepl (Phase 2).
  # The operator auto-generates a random bind password in <name>-replication Secret.
  replication:
    enabled: false
  # Example 3-replica multi-master cluster:
  # replicas: 3
  # replication:
  #   enabled: true

  # resources:
  #   requests:
  #     cpu: 100m
  #     memory: 128Mi
  #   limits:
  #     memory: 512Mi

  # securityContext overrides pod-level defaults (runAsUser/runAsGroup/fsGroup=1024).
  # securityContext:
  #   runAsUser: 1024
  #   runAsGroup: 1024
  #   fsGroup: 1024
