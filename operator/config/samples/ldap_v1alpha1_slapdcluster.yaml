apiVersion: ldap.chuck-chuck-chuck.net/v1alpha1
kind: SlapdCluster
metadata:
  name: slapd
spec:
  images:
    slapd:
      repository: ghcr.io/chuck-chuck-chuck-net/slaptain/slapd
      tag: latest
      pullPolicy: IfNotPresent
    init:
      repository: ghcr.io/chuck-chuck-chuck-net/slaptain/slapd-init
      tag: latest
      pullPolicy: IfNotPresent

  ldap:
    # cnConfigCredentials:
    #   secretName: "my-config-credentials"  # optional; omit to auto-generate
    forceRebootstrap: false
    tls:
      enabled: true
      secretName: slapd-tls

  # Set replicas > 1 together with replication.enabled=true for N-way multi-master.
  replicas: 1
  # logLevel is a slapd debug bitmask; omit to use the default 256 (stats).
  # Set to 0 to silence slapd entirely.

  persistence:
    enabled: true
    config:
      size: 1Gi
      accessMode: ReadWriteOnce
    data:
      size: 5Gi
      accessMode: ReadWriteOnce
    accesslog:
      size: 1Gi
      accessMode: ReadWriteOnce

  service:
    type: ClusterIP
    ldapPort: 389
    ldapsPort: 636

  replication:
    enabled: false
  # Example 3-replica multi-master cluster:
  # replicas: 3
  # replication:
  #   enabled: true
  #   keepalive: "300:10:60"
  #   retry: "10 +"
  #
  # Example with Multus replication network (ADR-007):
  # replicas: 2
  # replication:
  #   enabled: true
  #   network:
  #     multusNetwork: "infra/replication-net"  # NAD reference (namespace/name)
  #     useForInCluster: false                  # optional: use Multus for in-cluster too
  #   externalPeers:
  #     - name: site-b
  #       podAddresses:                         # per-pod Multus IPs
  #         - "192.168.99.128"
  #         - "192.168.99.129"
  #       port: 1025
  #       tlsSecretName: "site-b-ca"
  #       bindDN: "cn=replication,dc=chuck-chuck-chuck,dc=net"
  #       bindPasswordSecretName: "shared-repl-creds"
