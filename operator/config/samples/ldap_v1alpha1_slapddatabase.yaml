apiVersion: ldap.chuck-chuck-chuck.net/v1alpha1
kind: SlapdDatabase
metadata:
  name: example-db
spec:
  clusterRef: slapd
  suffix: "dc=example,dc=org"
  # rootDN defaults to "cn=admin,dc=example,dc=org"

  # credentials:
  #   # Optional. If omitted, the operator generates a Secret named
  #   # "<metadata.name>-credentials" with random plaintext values.
  #   # To pin a known password (e.g. preserving the admin password through a
  #   # migration), pre-create the Secret BEFORE this CR with this schema:
  #   #
  #   #   apiVersion: v1
  #   #   kind: Secret
  #   #   metadata:
  #   #     name: example-db-credentials
  #   #   type: Opaque
  #   #   stringData:
  #   #     root-password:        "<plaintext for cn=admin,<suffix>>"          # required
  #   #     replication-password: "<plaintext for cn=replication,<suffix>>"    # required when
  #   #                                                                        # replicas>1 or
  #   #                                                                        # externalPeers set;
  #   #                                                                        # optional otherwise
  #   #
  #   # The operator binds to slapd using these passwords — they must be plaintext,
  #   # not {SSHA}/{ARGON2}/{CRYPT}. The operator does not patch missing keys into a
  #   # user-provided Secret; a missing required key fails reconciliation with
  #   # phase=Error / reason=CredentialsInvalid. See docs/ONBOARDING.md §Secret and Credential Model.
  #   secretName: example-db-credentials

  # dataDirectory defaults to "example" (sanitized suffix)

  # acls is optional. When omitted, slapd's built-in default applies:
  # "to * by * read" — anonymous + authenticated users read all attributes,
  # rootdn (cn=admin,<suffix>) always bypasses ACLs. This matches a legacy
  # slapd.conf with no "access to" rules. Specify a list here to harden.
  acls:
    - 'to attrs=userPassword by self write by anonymous auth by * none'
    - 'to * by * read'

  indices:
    - "objectClass eq"
    - "uid eq,sub"
    - "cn eq,sub"
    - "entryCSN eq"
    - "entryUUID eq"

  # replication:
  #   ridBase: 100
  #   deltaSync: true
  #   syncprovCheckpoint: "500 15"
  #   accesslogPurge: "2+00:00 1+00:00"

  seed:
    entries:
      - |
        dn: dc=example,dc=org
        objectClass: top
        objectClass: dcObject
        objectClass: organization
        o: example
        dc: example
      - |
        dn: ou=People,dc=example,dc=org
        objectClass: organizationalUnit
        ou: People
      - |
        dn: ou=Groups,dc=example,dc=org
        objectClass: organizationalUnit
        ou: Groups

  cleanupPolicy: Retain
