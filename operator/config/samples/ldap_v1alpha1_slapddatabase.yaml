apiVersion: ldap.chuck-chuck-chuck.net/v1alpha1
kind: SlapdDatabase
metadata:
  name: example-db
spec:
  clusterRef: slapd
  suffix: "dc=example,dc=org"
  # rootDN defaults to "cn=admin,dc=example,dc=org"

  # credentials:
  #   # Optional. If omitted, the operator generates a Secret named
  #   # "<metadata.name>-credentials" with random plaintext values.
  #   # To pin a known password (e.g. preserving the admin password through a
  #   # migration), pre-create the Secret BEFORE this CR with this schema:
  #   #
  #   #   apiVersion: v1
  #   #   kind: Secret
  #   #   metadata:
  #   #     name: example-db-credentials
  #   #   type: Opaque
  #   #   stringData:
  #   #     root-password:        "<plaintext for cn=admin,<suffix>>"          # required
  #   #     replication-password: "<plaintext for cn=replication,<suffix>>"    # required when
  #   #                                                                        # replicas>1 or
  #   #                                                                        # externalPeers set;
  #   #                                                                        # optional otherwise
  #   #
  #   # The operator binds to slapd using these passwords — they must be plaintext,
  #   # not {SSHA}/{ARGON2}/{CRYPT}. The operator does not patch missing keys into a
  #   # user-provided Secret; a missing required key fails reconciliation with
  #   # phase=Error / reason=CredentialsInvalid. See docs/ONBOARDING.md §Secret and Credential Model.
  #   secretName: example-db-credentials

  # dataDirectory defaults to "example" (sanitized suffix)

  # acls is optional. When omitted, slapd's built-in default applies:
  # "to * by * read" — anonymous + authenticated users read all attributes,
  # rootdn (cn=admin,<suffix>) always bypasses ACLs. This matches a legacy
  # slapd.conf with no "access to" rules. Specify a list here to harden.
  acls:
    - 'to attrs=userPassword by self write by anonymous auth by * none'
    - 'to * by * read'

  indices:
    - "objectClass eq"
    - "uid eq,sub"
    - "cn eq,sub"
    - "entryCSN eq"
    - "entryUUID eq"

  # replication is required (v0.0.13+). Every SlapdDatabase must declare
  # whether it participates in cluster replication, even when the parent
  # SlapdCluster doesn't replicate at all — this makes "I forgot to configure
  # replication" loud at admission time instead of silently broken.
  #
  # Set enabled=false to explicitly exclude this database from cluster
  # replication (legitimate but rare: partial-migration coexistence, per-site
  # local state, static reference DBs). Otherwise supply ridSegment.
  replication:
    ridSegment: 1
    # deltaSync: true                # default
    # syncprovCheckpoint: "500 15"   # the DATA db's checkpoint; default "100 10"
    #
    # The ACCESSLOG db's checkpoint, which defaults ON at "1 1" and is the one
    # you should leave alone. A log DB's contextCSN is written only by a
    # checkpoint or a clean shutdown, while its minCSN is durable from the
    # first write carrying a new serverID — and an unclean stop in between
    # leaves the pod refusing EVERY consumer of that log, permanently
    # (ITS#9398). "1 1" is not a dial: the checkpoint has to fire on the log
    # entry's own operation, so a larger value reopens the window.
    # Measured cost: no throughput or latency penalty; ~7% less replication
    # headroom at a quarter of a million ops/s, on fast local storage.
    # accesslogSyncprovCheckpoint: "none"   # opt out, and take the exposure back
    #
    # WHERE the data DB's session log comes from. Unset means Accesslog since
    # 0.5.0: the in-memory log is lost at every restart, so a consumer that
    # reconnects after one takes a full refresh it did not need, while the
    # journal is already on disk. STARTUP-ONLY — editing this changes nothing
    # on a running pod; the operator reports
    # StartupConfigConverged=False/RestartRequired and leaves the restart to
    # you (ADR-034).
    # syncprovSessionlogSource: InMemory    # the pre-0.5.0 behaviour, by name
    #
    # accesslogPurge: what this database KEEPS. WHEN the purge runs is the
    # cluster's (SlapdCluster.spec.accesslogPurge.interval, or spec.rotation).
    # accesslogPurge:
    #   retention: "48h"       # unset -> 168h (7 days)
    #   enabled: false         # never purge; the journal grows unbounded

  seed:
    entries:
      - |
        dn: dc=example,dc=org
        objectClass: top
        objectClass: dcObject
        objectClass: organization
        o: example
        dc: example
      - |
        dn: ou=People,dc=example,dc=org
        objectClass: organizationalUnit
        ou: People
      - |
        dn: ou=Groups,dc=example,dc=org
        objectClass: organizationalUnit
        ou: Groups

  cleanupPolicy: Retain
