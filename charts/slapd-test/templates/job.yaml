apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "slapd-test.fullname" . }}
  labels:
    {{- include "slapd-test.labels" . | nindent 4 }}
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: tester
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            {{- $secretName := (default (printf "%s-passwords" (include "slapd-test.fullname" .)) .Values.slapd.secretName) }}
            - name: LDAP_ADMIN_PW
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: admin-password
            - name: LDAP_ROOT_PW
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: root-password
            - name: LDAPTLS_CACERT
              value: /etc/ldap/tls/ca.crt
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -eux
              apt-get update && apt-get install -y ldap-utils
              pip install pyyaml ldap3
              
              # Wait for slapd to be ready (LDAPS on port 636)
              until ldapsearch -x -H ldaps://{{ .Values.slapd.fullname }} -LLL -s base; do
                echo "Waiting for slapd (LDAPS)..."
                sleep 2
              done

              # Bootstrap Step 1 (Configuration)
              python /config/ldap-bootstrap.py -d -H ldaps://{{ .Values.slapd.fullname }}/ \
                -D "cn=admin,cn=config" -w "$LDAP_ROOT_PW" \
                /config/ox-schema.json /config/slapd-readpw.json
              
              # Bootstrap Step 2 (Data)
              python /config/ldap-bootstrap.py -d -H ldaps://{{ .Values.slapd.fullname }}/ \
                --domain {{ .Values.slapd.domain | quote }} -w "$LDAP_ADMIN_PW" \
                --auto-readpw /config/ldap-readpw-users.secret.yaml /config/slapd-ous.json
          volumeMounts:
            - name: config
              mountPath: /config
            - name: ca-cert
              mountPath: /etc/ldap/tls
      volumes:
        - name: config
          configMap:
            name: {{ include "slapd-test.fullname" . }}-config
        - name: ca-cert
          configMap:
            name: kube-root-ca.crt
