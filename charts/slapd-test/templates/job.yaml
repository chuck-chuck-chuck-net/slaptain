apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "slapd-test.fullname" . }}
  labels:
    {{- include "slapd-test.labels" . | nindent 4 }}
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: tester
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: LDAP_ROOT_PW
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.slapd.secretName }}
                  key: root-password
                  optional: true
            - name: LDAP_ROOT_PW_HASH
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.slapd.secretName }}
                  key: root-password-hash
                  optional: true
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -eux
              apt-get update && apt-get install -y ldap-utils
              pip install pyyaml ldap3
              
              # Wait for slapd to be ready
              until ldapsearch -x -H ldap://{{ .Values.slapd.fullname }}:389 -LLL -s base; do
                echo "Waiting for slapd..."
                sleep 2
              done

              # Authenticate: we need the password. If it's a hash, we can't easily get the plain text.
              # In our generated secret, it's either root-password (plain) or root-password-hash.
              # If it's random, it's in root-password.
              
              ROOT_PW="${LDAP_ROOT_PW:-admin}"
              
              # Bootstrap Step 1
              python /config/ldap-bootstrap.py -d -H ldap://{{ .Values.slapd.fullname }}:389/ \
                -D "cn=admin,cn=config" -w "$ROOT_PW" \
                /config/ox-schema.json /config/slapd-readpw.json
              
              # Bootstrap Step 2
              python /config/ldap-bootstrap.py -d -H ldap://{{ .Values.slapd.fullname }}:389/ \
                --domain {{ .Values.slapd.domain | quote }} -w "$ROOT_PW" \
                --auto-readpw /config/ldap-readpw-users.secret.yaml /config/slapd-ous.json
          volumeMounts:
            - name: config
              mountPath: /config
      volumes:
        - name: config
          configMap:
            name: {{ include "slapd-test.fullname" . }}-config
