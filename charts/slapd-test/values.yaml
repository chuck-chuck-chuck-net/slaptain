# Default values for slapd-test.

slapd:
  fullname: slapd
  domain: "dc=chuck-chuck-chuck,dc=net"

  # secretName: use a single combined secret for both admin-password and root-password
  # (backward compat; takes precedence over passwordsSecretName and configPasswordSecretName).
  secretName: ""

  # passwordsSecretName: secret containing admin-password key.
  # When set, admin-password is NOT written to the chart-managed <fullname>-passwords secret.
  passwordsSecretName: ""

  # configPasswordSecretName: secret containing root-password key.
  # When set, root-password is NOT written to the chart-managed <fullname>-passwords secret.
  configPasswordSecretName: ""

  # Provide plain text passwords when not using an existing secret
  adminPassword: ""  # required when secretName and passwordsSecretName are not set
  rootPassword: ""   # required when secretName and configPasswordSecretName are not set

image:
  repository: registry.internal/slaptain/slapd-toolkit
  tag: latest
  pullPolicy: IfNotPresent

# bootstrap: run the automated schema/ACL/data bootstrap Job after slapd is ready.
# Set enabled: false to skip bootstrapping — useful when you want an empty,
# unbootstrapped slapd to inspect or test manually via the toolkit.
bootstrap:
  enabled: true

  # readpwOU is the name of the OU subtree for read-only service accounts.
  # Referenced by the ACL configuration and the auto-readpw user creation.
  readpwOU: Readpw

  # customSchemaJson: optional LDAP schema to add to cn=config (JSON format).
  # Empty string means no custom schema is loaded.
  # Example: supply an application-specific olcSchemaConfig entry as JSON.
  customSchemaJson: ""

  # ousJson: JSON (or JSON array) describing the OUs to create under the domain.
  # Supports Helm template syntax; .Values.slapd.domain and .Values.bootstrap.readpwOU
  # are substituted at render time.
  ousJson: |
    [
      {"changetype":"add","dn":"ou={{ .Values.bootstrap.readpwOU }},{{ .Values.slapd.domain }}","objectClass":["organizationalUnit"],"attributes":[]},
      {"changetype":"add","dn":"ou=People,{{ .Values.slapd.domain }}","objectClass":["organizationalUnit"],"attributes":[]},
      {"changetype":"add","dn":"ou=Mail,{{ .Values.slapd.domain }}","objectClass":["organizationalUnit"],"attributes":[]}
    ]

  # readpwUsers: map of username to SSHA password hash for read-only service accounts.
  # Each entry is an individual value so they can be managed atomically via SOPS.
  # Generate hashes with: slappasswd -h {SSHA} -s yourpassword
  readpwUsers: {}
  # Example:
  #   myapp: "{SSHA}..."
  #   monitoring: "{SSHA}..."

  # readpwPasswords: map of username to plaintext password for read-only service accounts.
  # Keys must match entries in readpwUsers.  These plaintext passwords are stored in the
  # slapd-test-passwords Secret (alongside the admin/root passwords) so that e2e tests
  # can bind as readpw users to verify ACL enforcement.  Store encrypted with SOPS.
  readpwPasswords: {}
  # Example:
  #   myapp: "somepassword"
  #   monitoring: "anotherpassword"

# toolkit: a persistent Deployment with ldap-utils and python ldap3 pre-installed.
# Stays alive so you can kubectl exec into it for interactive testing and debugging.
# Example: kubectl exec -n slaptain <toolkit-pod> -- bash
toolkit:
  enabled: true
  replicas: 1
