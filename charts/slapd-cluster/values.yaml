# Default values for slapd-cluster.
# Deploys a SlapdCluster CR; the slaptain operator must be installed first.

# -- Override the resource name prefix.
# With the default "slapd" and release name "slapd", fullname resolves to "slapd"
# (since "slapd" contains "slapd").  This ensures SLAPD_HOST=slapd works the same
# way whether slapd is deployed via the standalone chart or via the operator.
nameOverride: slapd

# -- LDAP configuration.
ldap:
  domain: "dc=example,dc=org"
  forceRebootstrap: false
  tls:
    enabled: true
    secretName: "slapd-tls"
  # -- ACL rules for the data database, applied by the operator to every pod's
  # cn=config individually. Rules are in slapd.conf "access to ..." format (no {N} prefix).
  # When empty, the init container's default ACLs are preserved (userPassword hidden,
  # everything else readable by *).
  acls: []

# -- Credentials.
# The operator auto-generates passwords when credentialsSecretName is not set,
# storing them in <name>-passwords (admin-password + replication-password) and
# <name>-config-password (root-password).
#
# To supply your own passwords, create a Secret with the required keys and reference
# it here.  Required: admin-password, root-password.  Optional: replication-password.
#   kubectl create secret generic my-ldap-credentials \
#     --from-literal=admin-password=changeme \
#     --from-literal=root-password=changeme \
#     --from-literal=replication-password=changeme
credentials:
  existingSecret: ""

# -- Container images.
images:
  slapd:
    repository: registry.internal/slaptain/slapd
    tag: latest
    pullPolicy: Always
  init:
    repository: registry.internal/slaptain/slapd-init
    tag: latest
    pullPolicy: Always

# -- Number of replicas. Set replication.enabled=true when using replicas > 1.
replicas: 1

# -- Number of read-only consumer replicas. Requires replication.enabled=true.
readReplicas: 0

# -- slapd -d log level. 0 disables debug output.
logLevel: 0

# -- Persistent storage.
persistence:
  enabled: true
  config:
    size: 1Gi
    storageClass: ""
    accessMode: ReadWriteOnce
  data:
    size: 5Gi
    storageClass: ""
    accessMode: ReadWriteOnce
  # accesslog PVC is only provisioned when replication.enabled=true.
  accesslog:
    size: 1Gi
    storageClass: ""
    accessMode: ReadWriteOnce

# -- Replication (Phase 2+). N-way multi-master delta-syncrepl.
# Set enabled=true together with replicas>1 to activate.
# The replication bind password is stored in <name>-passwords under the replication-password key.
replication:
  enabled: false

# -- Service configuration.
service:
  type: ClusterIP
  ldapPort: 389
  ldapsPort: 636

# -- Compute resources for the slapd container.
resources: {}
#  requests:
#    cpu: 100m
#    memory: 128Mi
#  limits:
#    memory: 512Mi
