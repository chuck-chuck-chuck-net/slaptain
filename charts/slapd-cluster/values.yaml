# Default values for slapd-cluster.
# Deploys a SlapdCluster CR (infrastructure only); the slaptain operator must
# be installed first. Data databases and schemas are created separately via
# SlapdDatabase and SlapdSchema CRs. See ADR-004.

# -- Override the resource name prefix.
# With the default "slapd" and release name "slapd", fullname resolves to "slapd"
# (since "slapd" contains "slapd").  This ensures SLAPD_HOST=slapd works the same
# way whether slapd is deployed via the standalone chart or via the operator.
nameOverride: slapd

# -- LDAP configuration.
ldap:
  forceRebootstrap: false
  tls:
    enabled: true
    secretName: "slapd-tls"
  # -- cn=config admin credentials.
  # The operator auto-generates a <name>-config-password Secret when not set.
  # To supply your own, create a Secret with a "root-password" key.
  cnConfigCredentials:
    secretName: ""

# -- Container images.
images:
  slapd:
    repository: ghcr.io/chuck-chuck-chuck-net/slaptain/slapd
    tag: latest
    pullPolicy: IfNotPresent
  init:
    repository: ghcr.io/chuck-chuck-chuck-net/slaptain/slapd-init
    tag: latest
    pullPolicy: IfNotPresent

# -- Number of replicas. Set replication.enabled=true when using replicas > 1.
replicas: 1

# -- Number of read-only consumer replicas. Requires replication.enabled=true.
readReplicas: 0

# -- slapd -d debug bitmask. 256 = "stats" (startup banner + connection/op lines).
# Set to 0 to silence slapd entirely. See SlapdCluster.spec.logLevel godoc for
# the full bit table.
logLevel: 256

# -- Persistent storage.
persistence:
  enabled: true
  config:
    size: 1Gi
    storageClass: ""
    accessMode: ReadWriteOnce
  data:
    size: 5Gi
    storageClass: ""
    accessMode: ReadWriteOnce
  # accesslog PVC is only provisioned when replication.enabled=true.
  accesslog:
    size: 1Gi
    storageClass: ""
    accessMode: ReadWriteOnce

# -- Replication. N-way multi-master delta-syncrepl.
# Set enabled=true together with replicas>1 to activate.
# Per-database replication settings (deltaSync, ridBase, etc.) are on SlapdDatabase CRs.
replication:
  enabled: false
  # -- TCP keepalive for syncrepl connections. Format: "idle:probes:interval".
  keepalive: ""
  # -- Syncrepl retry interval. Format: "<interval> <count>" pairs.
  retry: "10 +"
  # -- Dedicated replication network via Multus (ADR-007).
  # When set, slapd pods get a secondary network interface for replication traffic.
  # network:
  #   multusNetwork: "infra/replication-net"  # NAD reference (namespace/name recommended)
  #   useForInCluster: false                  # Use Multus IPs for in-cluster syncrepl too

  # -- Cross-cluster external peers.
  # Each peer requires a name and either uri (single-endpoint) or podAddresses (per-pod Multus).
  externalPeers: []
  # Single-endpoint mode (NodePort / LoadBalancer):
  # - name: site-b
  #   uri: "ldaps://ldap.site-b.example.com:636"
  #   tlsSecretName: "site-b-ca"
  #   bindDN: "cn=replication,o=myapp"
  #   bindPasswordSecretName: "site-b-replication-password"
  #
  # Per-pod Multus mode (replication network, ADR-007):
  # - name: site-b
  #   podAddresses:
  #     - "192.168.99.128"   # site-b slapd-0
  #     - "192.168.99.129"   # site-b slapd-1
  #   port: 1025
  #   tlsSecretName: "site-b-ca"
  #   bindDN: "cn=replication,o=myapp"
  #   bindPasswordSecretName: "site-b-replication-password"

# -- Service configuration.
service:
  type: ClusterIP
  ldapPort: 389
  ldapsPort: 636

# -- Compute resources for the slapd container.
resources: {}
#  requests:
#    cpu: 100m
#    memory: 128Mi
#  limits:
#    memory: 512Mi

# -- List of image pull secrets for private registries.
imagePullSecrets: []
# - name: ghcr-pull-secret
