apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "operator.fullname" . }}-manager
  labels:
    {{- include "operator.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - secrets
      - services
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - apps
    resources:
      - statefulsets
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - ldap.chuck-chuck-chuck.net
    resources:
      - slapdclusters
      - slapdbackups
      - slapddatabases
      - slapdschemas
      - slapdscheduledbackups
      - slapdrestores
      # slapdmeshes: the site inventory a SlapdCluster resolves meshRef against
      # (ADR-028). This template is hand-maintained and does NOT track the
      # generated config/rbac/role.yaml, so a kind added there must be added
      # here too or the deployed operator reads it as forbidden.
      - slapdmeshes
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - batch
    resources:
      - jobs
    verbs:
      - create
      - delete
      - get
      - list
      - watch
  - apiGroups:
      - ldap.chuck-chuck-chuck.net
    resources:
      - slapdclusters/finalizers
      - slapddatabases/finalizers
      - slapdschemas/finalizers
    verbs:
      - update
  - apiGroups:
      - ldap.chuck-chuck-chuck.net
    resources:
      - slapdbackups/status
      - slapdclusters/status
      - slapddatabases/status
      - slapdschemas/status
      - slapdscheduledbackups/status
      - slapdrestores/status
    verbs:
      - get
      - patch
      - update
