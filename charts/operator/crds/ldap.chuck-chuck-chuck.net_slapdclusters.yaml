---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
  name: slapdclusters.ldap.chuck-chuck-chuck.net
spec:
  group: ldap.chuck-chuck-chuck.net
  names:
    kind: SlapdCluster
    listKind: SlapdClusterList
    plural: slapdclusters
    shortNames:
    - sc
    singular: slapdcluster
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.readyReplicas
      name: Ready
      type: integer
    - jsonPath: .status.replicas
      name: Replicas
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: SlapdCluster is the Schema for the slapdclusters API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of SlapdCluster.
            properties:
              images:
                description: images specifies the container images to use.
                properties:
                  init:
                    description: init is the slapd-init bootstrap container image.
                    properties:
                      pullPolicy:
                        default: Always
                        description: pullPolicy is the image pull policy.
                        type: string
                      repository:
                        description: repository is the image repository (e.g. "registry.internal/slaptain/slapd").
                        type: string
                      tag:
                        default: latest
                        description: tag is the image tag.
                        type: string
                    required:
                    - repository
                    type: object
                  slapd:
                    description: slapd is the main slapd runtime image.
                    properties:
                      pullPolicy:
                        default: Always
                        description: pullPolicy is the image pull policy.
                        type: string
                      repository:
                        description: repository is the image repository (e.g. "registry.internal/slaptain/slapd").
                        type: string
                      tag:
                        default: latest
                        description: tag is the image tag.
                        type: string
                    required:
                    - repository
                    type: object
                required:
                - init
                - slapd
                type: object
              ldap:
                description: ldap contains LDAP-specific configuration.
                properties:
                  acls:
                    description: |-
                      acls is the list of OpenLDAP ACL rules (olcAccess entries) to apply to the
                      data database on every pod. Rules are in standard slapd.conf "access to ..."
                      format, without the {N} index prefix — the operator numbers them and applies
                      them to each pod's cn=config individually (cn=config is not replicated).
                      When empty, the default ACLs generated by the init container are preserved.
                    items:
                      type: string
                    type: array
                  credentialsSecretName:
                    description: |-
                      credentialsSecretName references an existing Secret containing admin-password
                      and root-password keys (plaintext); replication-password is optional. When set,
                      the operator reads these and creates the two typed secrets (<name>-passwords and
                      <name>-config-password). When not set, passwords are auto-generated.
                    type: string
                  domain:
                    description: domain is the LDAP domain in DC notation, e.g. "dc=example,dc=org".
                    type: string
                  forceRebootstrap:
                    default: false
                    description: |-
                      forceRebootstrap instructs the init container to re-run bootstrap even if
                      data already exists. Handle with care — this will overwrite existing data.
                    type: boolean
                  tls:
                    description: tls configures TLS/LDAPS.
                    properties:
                      enabled:
                        default: false
                        description: enabled controls whether TLS/LDAPS is active.
                        type: boolean
                      secretName:
                        description: secretName is the name of the TLS Secret containing
                          tls.crt, tls.key, and ca.crt.
                        type: string
                    type: object
                required:
                - domain
                type: object
              logLevel:
                default: 0
                description: logLevel is the slapd -d debug level. 0 disables debug
                  output.
                format: int32
                type: integer
              persistence:
                description: persistence configures persistent storage for config
                  and data volumes.
                properties:
                  accesslog:
                    description: |-
                      accesslog is the PVC for the delta-syncrepl access log (/ldap-accesslog).
                      Only provisioned when replication is enabled.
                    properties:
                      accessMode:
                        default: ReadWriteOnce
                        description: accessMode is the PVC access mode.
                        type: string
                      size:
                        default: 1Gi
                        description: size is the requested storage size.
                        type: string
                      storageClass:
                        description: storageClass is the storage class name. Defaults
                          to the cluster default if empty.
                        type: string
                    type: object
                  config:
                    description: config is the PVC for the slapd configuration directory
                      (/ldap-config).
                    properties:
                      accessMode:
                        default: ReadWriteOnce
                        description: accessMode is the PVC access mode.
                        type: string
                      size:
                        default: 1Gi
                        description: size is the requested storage size.
                        type: string
                      storageClass:
                        description: storageClass is the storage class name. Defaults
                          to the cluster default if empty.
                        type: string
                    type: object
                  data:
                    description: data is the PVC for the slapd data directory (/ldap-data).
                    properties:
                      accessMode:
                        default: ReadWriteOnce
                        description: accessMode is the PVC access mode.
                        type: string
                      size:
                        default: 1Gi
                        description: size is the requested storage size.
                        type: string
                      storageClass:
                        description: storageClass is the storage class name. Defaults
                          to the cluster default if empty.
                        type: string
                    type: object
                  enabled:
                    default: true
                    description: enabled controls whether PVCs are created. When false,
                      emptyDir is used.
                    type: boolean
                type: object
              replicas:
                default: 1
                description: replicas is the number of slapd replicas. Set spec.replication.enabled=true
                  for replicas>1.
                format: int32
                minimum: 1
                type: integer
              replication:
                description: replication configures N-way multi-master delta-syncrepl
                  replication (Phase 2+).
                properties:
                  accessLogEnabled:
                    default: false
                    description: accessLogEnabled enables the access log overlay required
                      for delta-syncrepl.
                    type: boolean
                  enabled:
                    default: false
                    description: enabled controls whether replication is active.
                    type: boolean
                  externalPeers:
                    description: externalPeers lists cross-cluster peers (Phase 3).
                    items:
                      description: ExternalPeer defines a cross-cluster peer for Phase
                        3 replication.
                      properties:
                        bindDN:
                          description: bindDN is the DN used to authenticate to the
                            remote peer.
                          type: string
                        bindPasswordSecretName:
                          description: bindPasswordSecretName is the name of the Secret
                            containing the bind password.
                          type: string
                        name:
                          description: name is a human-readable identifier for this
                            peer.
                          type: string
                        tlsSecretName:
                          description: tlsSecretName is the name of the Secret containing
                            the CA cert for verifying the peer.
                          type: string
                        uri:
                          description: uri is the LDAP URI of the remote peer, e.g.
                            "ldaps://ldap.remote-site.example.com:636".
                          type: string
                      required:
                      - name
                      - uri
                      type: object
                    type: array
                  mode:
                    description: mode is the replication mode (e.g. "delta-syncrepl").
                    type: string
                  peers:
                    description: peers lists in-cluster peer SlapdClusters (Phase
                      2).
                    items:
                      description: PeerRef references a peer SlapdCluster in the same
                        namespace (Phase 2).
                      properties:
                        name:
                          description: name is the name of the peer SlapdCluster resource.
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                  role:
                    description: role is the replication role of this cluster.
                    type: string
                type: object
              resources:
                description: resources sets compute resource requests and limits for
                  the slapd container.
                properties:
                  claims:
                    description: |-
                      Claims lists the names of resources, defined in spec.resourceClaims,
                      that are used by this container.

                      This field depends on the
                      DynamicResourceAllocation feature gate.

                      This field is immutable. It can only be set for containers.
                    items:
                      description: ResourceClaim references one entry in PodSpec.ResourceClaims.
                      properties:
                        name:
                          description: |-
                            Name must match the name of one entry in pod.spec.resourceClaims of
                            the Pod where this field is used. It makes that resource available
                            inside a container.
                          type: string
                        request:
                          description: |-
                            Request is the name chosen for a request in the referenced claim.
                            If empty, everything from the claim is made available, otherwise
                            only the result of this request.
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  limits:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Limits describes the maximum amount of compute resources allowed.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                  requests:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Requests describes the minimum amount of compute resources required.
                      If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,
                      otherwise to an implementation-defined value. Requests cannot exceed Limits.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                type: object
              securityContext:
                description: |-
                  securityContext overrides the pod-level security context.
                  When nil, defaults of runAsUser/runAsGroup/fsGroup=1024 are applied.
                properties:
                  appArmorProfile:
                    description: |-
                      appArmorProfile is the AppArmor options to use by the containers in this pod.
                      Note that this field cannot be set when spec.os.name is windows.
                    properties:
                      localhostProfile:
                        description: |-
                          localhostProfile indicates a profile loaded on the node that should be used.
                          The profile must be preconfigured on the node to work.
                          Must match the loaded name of the profile.
                          Must be set if and only if type is "Localhost".
                        type: string
                      type:
                        description: |-
                          type indicates which kind of AppArmor profile will be applied.
                          Valid options are:
                            Localhost - a profile pre-loaded on the node.
                            RuntimeDefault - the container runtime's default profile.
                            Unconfined - no AppArmor enforcement.
                        type: string
                    required:
                    - type
                    type: object
                  fsGroup:
                    description: |-
                      A special supplemental group that applies to all containers in a pod.
                      Some volume types allow the Kubelet to change the ownership of that volume
                      to be owned by the pod:

                      1. The owning GID will be the FSGroup
                      2. The setgid bit is set (new files created in the volume will be owned by FSGroup)
                      3. The permission bits are OR'd with rw-rw----

                      If unset, the Kubelet will not modify the ownership and permissions of any volume.
                      Note that this field cannot be set when spec.os.name is windows.
                    format: int64
                    type: integer
                  fsGroupChangePolicy:
                    description: |-
                      fsGroupChangePolicy defines behavior of changing ownership and permission of the volume
                      before being exposed inside Pod. This field will only apply to
                      volume types which support fsGroup based ownership(and permissions).
                      It will have no effect on ephemeral volume types such as: secret, configmaps
                      and emptydir.
                      Valid values are "OnRootMismatch" and "Always". If not specified, "Always" is used.
                      Note that this field cannot be set when spec.os.name is windows.
                    type: string
                  runAsGroup:
                    description: |-
                      The GID to run the entrypoint of the container process.
                      Uses runtime default if unset.
                      May also be set in SecurityContext.  If set in both SecurityContext and
                      PodSecurityContext, the value specified in SecurityContext takes precedence
                      for that container.
                      Note that this field cannot be set when spec.os.name is windows.
                    format: int64
                    type: integer
                  runAsNonRoot:
                    description: |-
                      Indicates that the container must run as a non-root user.
                      If true, the Kubelet will validate the image at runtime to ensure that it
                      does not run as UID 0 (root) and fail to start the container if it does.
                      If unset or false, no such validation will be performed.
                      May also be set in SecurityContext.  If set in both SecurityContext and
                      PodSecurityContext, the value specified in SecurityContext takes precedence.
                    type: boolean
                  runAsUser:
                    description: |-
                      The UID to run the entrypoint of the container process.
                      Defaults to user specified in image metadata if unspecified.
                      May also be set in SecurityContext.  If set in both SecurityContext and
                      PodSecurityContext, the value specified in SecurityContext takes precedence
                      for that container.
                      Note that this field cannot be set when spec.os.name is windows.
                    format: int64
                    type: integer
                  seLinuxChangePolicy:
                    description: |-
                      seLinuxChangePolicy defines how the container's SELinux label is applied to all volumes used by the Pod.
                      It has no effect on nodes that do not support SELinux or to volumes does not support SELinux.
                      Valid values are "MountOption" and "Recursive".

                      "Recursive" means relabeling of all files on all Pod volumes by the container runtime.
                      This may be slow for large volumes, but allows mixing privileged and unprivileged Pods sharing the same volume on the same node.

                      "MountOption" mounts all eligible Pod volumes with `-o context` mount option.
                      This requires all Pods that share the same volume to use the same SELinux label.
                      It is not possible to share the same volume among privileged and unprivileged Pods.
                      Eligible volumes are in-tree FibreChannel and iSCSI volumes, and all CSI volumes
                      whose CSI driver announces SELinux support by setting spec.seLinuxMount: true in their
                      CSIDriver instance. Other volumes are always re-labelled recursively.
                      "MountOption" value is allowed only when SELinuxMount feature gate is enabled.

                      If not specified and SELinuxMount feature gate is enabled, "MountOption" is used.
                      If not specified and SELinuxMount feature gate is disabled, "MountOption" is used for ReadWriteOncePod volumes
                      and "Recursive" for all other volumes.

                      This field affects only Pods that have SELinux label set, either in PodSecurityContext or in SecurityContext of all containers.

                      All Pods that use the same volume should use the same seLinuxChangePolicy, otherwise some pods can get stuck in ContainerCreating state.
                      Note that this field cannot be set when spec.os.name is windows.
                    type: string
                  seLinuxOptions:
                    description: |-
                      The SELinux context to be applied to all containers.
                      If unspecified, the container runtime will allocate a random SELinux context for each
                      container.  May also be set in SecurityContext.  If set in
                      both SecurityContext and PodSecurityContext, the value specified in SecurityContext
                      takes precedence for that container.
                      Note that this field cannot be set when spec.os.name is windows.
                    properties:
                      level:
                        description: Level is SELinux level label that applies to
                          the container.
                        type: string
                      role:
                        description: Role is a SELinux role label that applies to
                          the container.
                        type: string
                      type:
                        description: Type is a SELinux type label that applies to
                          the container.
                        type: string
                      user:
                        description: User is a SELinux user label that applies to
                          the container.
                        type: string
                    type: object
                  seccompProfile:
                    description: |-
                      The seccomp options to use by the containers in this pod.
                      Note that this field cannot be set when spec.os.name is windows.
                    properties:
                      localhostProfile:
                        description: |-
                          localhostProfile indicates a profile defined in a file on the node should be used.
                          The profile must be preconfigured on the node to work.
                          Must be a descending path, relative to the kubelet's configured seccomp profile location.
                          Must be set if type is "Localhost". Must NOT be set for any other type.
                        type: string
                      type:
                        description: |-
                          type indicates which kind of seccomp profile will be applied.
                          Valid options are:

                          Localhost - a profile defined in a file on the node should be used.
                          RuntimeDefault - the container runtime default profile should be used.
                          Unconfined - no profile should be applied.
                        type: string
                    required:
                    - type
                    type: object
                  supplementalGroups:
                    description: |-
                      A list of groups applied to the first process run in each container, in
                      addition to the container's primary GID and fsGroup (if specified).  If
                      the SupplementalGroupsPolicy feature is enabled, the
                      supplementalGroupsPolicy field determines whether these are in addition
                      to or instead of any group memberships defined in the container image.
                      If unspecified, no additional groups are added, though group memberships
                      defined in the container image may still be used, depending on the
                      supplementalGroupsPolicy field.
                      Note that this field cannot be set when spec.os.name is windows.
                    items:
                      format: int64
                      type: integer
                    type: array
                    x-kubernetes-list-type: atomic
                  supplementalGroupsPolicy:
                    description: |-
                      Defines how supplemental groups of the first container processes are calculated.
                      Valid values are "Merge" and "Strict". If not specified, "Merge" is used.
                      (Alpha) Using the field requires the SupplementalGroupsPolicy feature gate to be enabled
                      and the container runtime must implement support for this feature.
                      Note that this field cannot be set when spec.os.name is windows.
                    type: string
                  sysctls:
                    description: |-
                      Sysctls hold a list of namespaced sysctls used for the pod. Pods with unsupported
                      sysctls (by the container runtime) might fail to launch.
                      Note that this field cannot be set when spec.os.name is windows.
                    items:
                      description: Sysctl defines a kernel parameter to be set
                      properties:
                        name:
                          description: Name of a property to set
                          type: string
                        value:
                          description: Value of a property to set
                          type: string
                      required:
                      - name
                      - value
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  windowsOptions:
                    description: |-
                      The Windows specific settings applied to all containers.
                      If unspecified, the options within a container's SecurityContext will be used.
                      If set in both SecurityContext and PodSecurityContext, the value specified in SecurityContext takes precedence.
                      Note that this field cannot be set when spec.os.name is linux.
                    properties:
                      gmsaCredentialSpec:
                        description: |-
                          GMSACredentialSpec is where the GMSA admission webhook
                          (https://github.com/kubernetes-sigs/windows-gmsa) inlines the contents of the
                          GMSA credential spec named by the GMSACredentialSpecName field.
                        type: string
                      gmsaCredentialSpecName:
                        description: GMSACredentialSpecName is the name of the GMSA
                          credential spec to use.
                        type: string
                      hostProcess:
                        description: |-
                          HostProcess determines if a container should be run as a 'Host Process' container.
                          All of a Pod's containers must have the same effective HostProcess value
                          (it is not allowed to have a mix of HostProcess containers and non-HostProcess containers).
                          In addition, if HostProcess is true then HostNetwork must also be set to true.
                        type: boolean
                      runAsUserName:
                        description: |-
                          The UserName in Windows to run the entrypoint of the container process.
                          Defaults to the user specified in image metadata if unspecified.
                          May also be set in PodSecurityContext. If set in both SecurityContext and
                          PodSecurityContext, the value specified in SecurityContext takes precedence.
                        type: string
                    type: object
                type: object
              service:
                description: service configures the ClusterIP service.
                properties:
                  ldapPort:
                    default: 389
                    description: ldapPort is the external service port for LDAP.
                    format: int32
                    type: integer
                  ldapsPort:
                    default: 636
                    description: ldapsPort is the external service port for LDAPS.
                    format: int32
                    type: integer
                  type:
                    default: ClusterIP
                    description: type is the Kubernetes Service type.
                    type: string
                type: object
            required:
            - images
            - ldap
            type: object
          status:
            description: status defines the observed state of SlapdCluster.
            properties:
              bootstrapComplete:
                description: |-
                  bootstrapComplete indicates that the operator has successfully seeded the
                  initial LDAP directory entries (root entry, admin, replication user).
                type: boolean
              conditions:
                description: conditions holds standard Kubernetes condition entries.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: observedGeneration is the .metadata.generation the controller
                  last reconciled.
                format: int64
                type: integer
              phase:
                description: phase summarises the current lifecycle state.
                type: string
              readyReplicas:
                description: readyReplicas is the number of pods reporting Ready.
                format: int32
                type: integer
              replicas:
                description: replicas is the total number of pods (ready or not).
                format: int32
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
