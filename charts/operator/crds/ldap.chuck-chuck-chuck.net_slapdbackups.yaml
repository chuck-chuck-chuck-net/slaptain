---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
  name: slapdbackups.ldap.chuck-chuck-chuck.net
spec:
  group: ldap.chuck-chuck-chuck.net
  names:
    kind: SlapdBackup
    listKind: SlapdBackupList
    plural: slapdbackups
    shortNames:
    - sb
    singular: slapdbackup
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.databaseRef
      name: Database
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.sourcePod
      name: Source
      priority: 1
      type: string
    - jsonPath: .status.completedAt
      name: Completed
      type: date
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          SlapdBackup is the Schema for the slapdbackups API. Each instance is one
          on-demand backup of a SlapdDatabase's data tree to S3. See ADR-014.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired backup.
            properties:
              compression:
                default: gzip
                description: compression for the LDIF artifact. Only "gzip" is supported
                  in the MVP.
                enum:
                - gzip
                type: string
              databaseRef:
                description: |-
                  databaseRef is the name of the SlapdDatabase to back up. Must be in the
                  same namespace.
                type: string
              podAffinity:
                default: true
                description: |-
                  podAffinity controls whether the backup Job is pinned (required
                  PodAffinity, topologyKey kubernetes.io/hostname) to the node of the target
                  slapd pod, which it must co-locate with to mount the ReadWriteOnce data
                  PVC. Default true. Set false only when the cluster forbids co-scheduling
                  Jobs onto data nodes — a node able to mount the PVC must then be available.

                  Tristate (*bool): an explicit false must round-trip through the API server
                  unchanged, which a plain bool + omitempty + kubebuilder:default does not
                  guarantee.
                type: boolean
              storage:
                description: storage configures the S3 target for the backup artifact.
                properties:
                  bucket:
                    description: bucket is the S3 bucket name.
                    type: string
                  credentialsSecretName:
                    description: |-
                      credentialsSecretName references a Secret holding the S3 credentials.
                      Required keys (plaintext): "access-key-id" and "secret-access-key".
                      (IRSA / workload-identity credentials are a future addition; the MVP is
                      static key-based only.)
                    type: string
                  endpoint:
                    description: |-
                      endpoint is the S3 endpoint URL. Leave empty for AWS S3; set it for an
                      S3-compatible store (Ceph RGW, versitygw), e.g. "https://s3.example:9000".
                    type: string
                  insecureTLS:
                    default: false
                    description: |-
                      insecureTLS disables TLS certificate verification against the endpoint.
                      Use only for testing against a self-signed S3-compatible server. Default false.
                    type: boolean
                  prefix:
                    description: |-
                      prefix is an optional key prefix within the bucket. Backup objects are
                      written under "<prefix>/<cluster>/<database>/<timestamp>.ldif.gz".
                    type: string
                  region:
                    description: region is the S3 region. Some S3-compatible stores
                      ignore it.
                    type: string
                required:
                - bucket
                - credentialsSecretName
                type: object
            required:
            - databaseRef
            - storage
            type: object
          status:
            description: status defines the observed state of the backup.
            properties:
              completedAt:
                description: completedAt is when the backup finished (success or failure).
                format: date-time
                type: string
              conditions:
                description: |-
                  conditions holds standard Kubernetes condition entries. Besides "Complete",
                  a backup carries "SourceConverged": whether the SlapdCluster reported its
                  replicas converged (its own ReplicationConverged condition) at backup time.
                  It is a record, never a gate — a backup always takes a backup.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              jobName:
                description: jobName is the name of the Job the controller created
                  to run the backup.
                type: string
              observedGeneration:
                description: observedGeneration is the .metadata.generation the controller
                  last reconciled.
                format: int64
                type: integer
              path:
                description: path is the S3 object key of the completed artifact.
                type: string
              phase:
                description: phase summarises the backup's lifecycle state.
                type: string
              sizeBytes:
                description: sizeBytes is the size of the uploaded artifact in bytes.
                format: int64
                type: integer
              sourceContextCSN:
                description: |-
                  sourceContextCSN is the source pod's contextCSN vector for the database's
                  suffix, read when the backup Job was created. It is the queryable copy of
                  the vector the artifact itself embeds, and pins the artifact's position in
                  the replication timeline. Empty when the database has no contextCSN (an
                  unreplicated database has no syncprov overlay) or when the read failed —
                  a failed read never fails the backup.
                items:
                  type: string
                type: array
              sourcePod:
                description: |-
                  sourcePod is the slapd pod the artifact was read from (today always
                  "<cluster>-0" — the backup Job co-locates with pod-0). A backup is one
                  pod's view of the DIT, not the cluster's; recording which pod makes that
                  explicit and is the first thing to look at when a restored tree is missing
                  a write that was ACKed before the backup (ADR-014 amendment 2026-09-12).
                type: string
              startedAt:
                description: startedAt is when the backup Job started running.
                format: date-time
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
