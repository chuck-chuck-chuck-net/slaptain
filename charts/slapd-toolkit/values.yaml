# Default values for slapd-toolkit.
# Deploys a long-running debug pod (ldap-utils, python3, ldap3) wired to an
# operator-managed SlapdCluster. Use it via `kubectl exec`.

# -- Name of the target SlapdCluster. Drives the cn=config admin Secret name
# (`<clusterName>-config-password`) and the in-cluster LDAP service hostname.
clusterName: slapd

# -- Name of the target SlapdDatabase. Drives the data admin Secret name
# (`<dbName>-credentials`).
dbName: default

# -- Toolkit image (built from images/slapd-toolkit/).
image:
  repository: ghcr.io/chuck-chuck-chuck-net/slaptain/slapd-toolkit
  # -- Image tag. Empty string falls back to the chart's appVersion, which is
  # set at package time from the git tag (e.g. v0.2.0) and matches the published
  # image tag — see Makefile target charts-package. There is no `latest` tag in
  # the registry: images are pushed under their git tag only.
  tag: ""
  pullPolicy: IfNotPresent

# -- TLS Secret carrying the cluster CA (`make gencert` creates one), mounted at
# /etc/ldap/tls so LDAPTLS_CACERT can point at it. Set secretName to "" for a
# cluster without TLS (spec.ldap.tls.enabled=false): the mount and the env var
# are then omitted rather than left dangling on a Secret that does not exist.
tls:
  secretName: slapd-tls

replicas: 1

# -- Optional: list of image pull secrets for private registries.
imagePullSecrets: []
