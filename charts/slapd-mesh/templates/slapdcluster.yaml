{{- /*
The SlapdCluster of the bundle.

Three fields are conspicuously absent and must stay absent:
spec.replication.serverIDBase, spec.replication.externalPeers and
spec.replication.network. All three are DERIVED by the operator from meshRef
plus its own SITE_NAME (ADR-028 §4), and setting any of them alongside meshRef
is refused outright — the cluster reports MeshResolved=False and reconciles
nothing. That refusal is the design working: ambiguity about serverIDBase is how
a CSN-eating collision gets in quietly. The network belongs to the mesh
(mesh.network), because two clusters on one fabric cannot sensibly disagree
about whether pod CIDRs are routed.
*/ -}}
apiVersion: ldap.chuck-chuck-chuck.net/v1alpha1
kind: SlapdCluster
metadata:
  name: {{ .Values.cluster.name }}
  labels:
    {{- include "slapd-mesh.labels" . | nindent 4 }}
spec:
  meshRef: {{ .Values.mesh.name | quote }}
  {{- with .Values.cluster.sites }}
  sites:
    {{- toYaml . | nindent 4 }}
  {{- end }}

  {{- with .Values.cluster.images }}
  images:
    {{- toYaml . | nindent 4 }}
  {{- end }}

  ldap:
    {{- with .Values.cluster.ldap.cnConfigCredentials }}
    {{- with .secretName }}
    cnConfigCredentials:
      secretName: {{ . | quote }}
    {{- end }}
    {{- end }}
    tls:
      enabled: {{ .Values.cluster.ldap.tls.enabled }}
      {{- if .Values.cluster.ldap.tls.enabled }}
      secretName: {{ .Values.cluster.ldap.tls.secretName | quote }}
      {{- end }}

  {{- /* Presence-based, never truthiness: 0 is a meaningful value for all three
         (logLevel 0 silences slapd), and kindIs catches `key:` with nothing
         after it, which hasKey reports as present. The chart does not restate
         the operator's defaults — see charts/slapd for the full reasoning; a
         value written here would be frozen at install time. */ -}}
  {{- range $k := list "replicas" "readReplicas" "logLevel" }}
  {{- if and (hasKey $.Values.cluster $k) (not (kindIs "invalid" (index $.Values.cluster $k))) }}
  {{ $k }}: {{ index $.Values.cluster $k }}
  {{- end }}
  {{- end }}

  {{- $p := .Values.cluster.persistence | default dict -}}
  {{- $pc := $p.config | default dict -}}
  {{- $pd := $p.data | default dict -}}
  {{- $pa := $p.accesslog | default dict -}}
  {{- if or $pc $pd $pa }}
  persistence:
    {{- range $k, $v := (dict "config" $pc "data" $pd "accesslog" $pa) }}
    {{- if $v }}
    {{ $k }}:
      {{- with $v.size }}
      size: {{ . | quote }}
      {{- end }}
      {{- with $v.accessMode }}
      accessMode: {{ . }}
      {{- end }}
      {{- with $v.storageClass }}
      storageClass: {{ . | quote }}
      {{- end }}
    {{- end }}
    {{- end }}
  {{- end }}

  {{- $svc := .Values.cluster.service | default dict -}}
  {{- if or $svc.type $svc.ldapPort $svc.ldapsPort $svc.annotations }}
  service:
    {{- with $svc.type }}
    type: {{ . }}
    {{- end }}
    {{- with $svc.ldapPort }}
    ldapPort: {{ . }}
    {{- end }}
    {{- with $svc.ldapsPort }}
    ldapsPort: {{ . }}
    {{- end }}
    {{- with $svc.annotations }}
    annotations:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- end }}

  {{- $r := .Values.cluster.replication | default dict -}}
  {{- if or $r.enabled $r.mode $r.keepalive $r.retry }}
  replication:
    {{- if $r.enabled }}
    enabled: true
    {{- end }}
    {{- with $r.mode }}
    mode: {{ . | quote }}
    {{- end }}
    {{- with $r.keepalive }}
    keepalive: {{ . | quote }}
    {{- end }}
    {{- with $r.retry }}
    retry: {{ . | quote }}
    {{- end }}
    {{- with $r.replicasPerPeer }}
    replicasPerPeer: {{ . }}
    {{- end }}
  {{- end }}

  {{- with .Values.cluster.resources }}
  resources:
    {{- toYaml . | nindent 4 }}
  {{- end }}

  {{- with .Values.cluster.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}

  {{- with .Values.cluster.monitoring }}
  monitoring:
    {{- toYaml . | nindent 4 }}
  {{- end }}

  {{- /* spec.placement (ADR-043). Where this cluster's pods are allowed to
         land. Raw Kubernetes types, passed through verbatim.

         This file is applied IDENTICALLY at every site (ADR-028 §5), which
         makes the pass-through keys the one place in this block where a site
         can leak in: a nodeSelector or a nodeAffinity naming a node, a rack or
         a zone that exists at one site is wrong at the others, and nothing
         here or in the operator will say so. Select on labels every site
         carries. The generated default is safe by construction — it selects on
         kubernetes.io/hostname and on the cluster's own fleet labels, which
         every site has.

         topologySpreadConstraints is the one key that is NOT written with the
         usual `with`, and the reason is semantic rather than stylistic. The
         operator distinguishes three states, not two: absent means "said
         nothing" and gets the operator's generated per-fleet spread; an
         explicit [] means "said none" and is the ONLY way to switch that
         default off. `with` treats an empty list exactly like an absent one,
         so it would silently drop a user's [] and hand them back the default
         they had just turned off — with no error anywhere to notice it by.

         kindIs "slice" is what tells the three apart: an absent key and an
         explicitly null one are both "invalid" and render nothing (null reads
         as absent, which is also how the API server stores it), while [] and
         a populated list are both slices and are rendered as written. */}}
  {{- $placement := .Values.cluster.placement | default dict }}
  {{- $spread := $placement.topologySpreadConstraints }}
  {{- if or (kindIs "slice" $spread) $placement.nodeSelector $placement.nodeAffinity $placement.tolerations $placement.priorityClassName }}
  placement:
    {{- if kindIs "slice" $spread }}
    {{- if $spread }}
    topologySpreadConstraints:
      {{- toYaml $spread | nindent 6 }}
    {{- else }}
    topologySpreadConstraints: []
    {{- end }}
    {{- end }}
    {{- with $placement.nodeSelector }}
    nodeSelector:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with $placement.nodeAffinity }}
    nodeAffinity:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with $placement.tolerations }}
    tolerations:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with $placement.priorityClassName }}
    priorityClassName: {{ . | quote }}
    {{- end }}
  {{- end }}

  {{- /* spec.rotation (ADR-037). Mesh-scoped by construction and it must stay
         that way: the three values below are a schedule shape — a duration and
         a slot count — and none of them names a site, an endpoint or a pod.
         They are read from .Values.cluster.rotation, which this chart applies
         unchanged at every site, so every site derives the SAME grid from the
         SAME spec.replicas. There is deliberately no per-site override and
         there must never be one: sites rotating on different grids would still
         each be internally correct, so the divergence would be invisible to
         every parity check the mesh has (ADR-028 §3 — existence and a hash).

         The grid is per SITE, not per mesh. Each site's write endpoint moves
         over that site's own read-write pods; a cross-site write still lands
         wherever the client sent it. That is not a gap in the rotation — a
         mesh accepts a write at any provider by design (ADR-037 decision 2).

         The sibling is spec.accesslogPurge (form A): one interval, every pod
         purging together. The two are MUTUALLY EXCLUSIVE and the operator
         refuses both as RotationConfigured=False/ScheduleDeclaredTwice —
         refusing here instead would be a second authority with a worse
         message and no view of spec.replicas.

         Field-by-field rather than toYaml for the same three reasons as
         charts/slapd — every duration must reach the API server as a string,
         and `enabled: false` / `slotsFromWriteToPurge: 0` must survive being
         falsy. See that chart's template for the full argument. */ -}}
  {{- $purge := .Values.cluster.accesslogPurge | default dict -}}
  {{- with $purge.interval }}
  accesslogPurge:
    interval: {{ . | quote }}
  {{- end }}
  {{- $rot := .Values.cluster.rotation | default dict -}}
  {{- $hasRotEnabled := and (hasKey $rot "enabled") (not (kindIs "invalid" $rot.enabled)) -}}
  {{- $hasSlots := and (hasKey $rot "slotsFromWriteToPurge") (not (kindIs "invalid" $rot.slotsFromWriteToPurge)) -}}
  {{- if or $hasRotEnabled $rot.slotLength $hasSlots $rot.leadTime $rot.mode }}
  rotation:
    {{- if $hasRotEnabled }}
    enabled: {{ $rot.enabled }}
    {{- end }}
    {{- /* mode is rendered even though the charts recommend only the coupled
           default, because the alternative is worse: kubectl explain tells
           people the field exists, and a value set here that the template did
           not know about would be silently dropped. Unset renders nothing and
           the operator reads it as PurgeAndWrite. */ -}}
    {{- with $rot.mode }}
    mode: {{ . | quote }}
    {{- end }}
    {{- with $rot.slotLength }}
    slotLength: {{ . | quote }}
    {{- end }}
    {{- if $hasSlots }}
    slotsFromWriteToPurge: {{ $rot.slotsFromWriteToPurge }}
    {{- end }}
    {{- /* leadTime needs no falsy guard: unset and "0s" MEAN the same thing —
           the endpoint moving at the boundary — so there is no value the
           operator must be told about that `with` would swallow. Quoted for
           the same reason slotLength is. */ -}}
    {{- with $rot.leadTime }}
    leadTime: {{ . | quote }}
    {{- end }}
  {{- end }}
