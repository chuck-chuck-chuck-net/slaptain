# Default values for slapd-mesh.
#
# THIS FILE GOES TO EVERY SITE UNCHANGED.
#
# Every object this chart renders is mesh-scoped, so the rendered manifest must
# be byte-identical at every site — that is what makes cross-site parity
# checkable as "does it exist, and does it hash the same" instead of a
# field-by-field comparison somebody gets wrong (ADR-028 §3). Two consequences:
#
#   * There are no per-site values here, and there must never be. A value you
#     want to differ between sites means the design has been violated, not that
#     the chart is missing a knob.
#   * The single per-site fact in the system — "which of these sites am I?" —
#     lives on the OPERATOR's chart, not this one:
#
#         helm upgrade --install slaptain ./charts/operator \
#           --set siteName=site-a
#
#     Get it wrong at two sites and they collide their serverID stride slots, which
#     slapd does not validate and whose only symptom is that some writes never
#     propagate. It is the first thing to verify.
#
# The chart also generates nothing random and nothing release-derived: object
# names come from these values, never from the Helm release name, and no Secret
# is created here. In particular the replication password must be IDENTICAL
# mesh-wide (ADR-008); a chart that generated one would hand every site a
# different secret and the breakage would look like an auth bug. Secrets and CAs
# are bootstrapped out of band — cert-manager / trust-manager for the CA,
# External Secrets or documented SOPS for the shared password (ADR-028 §7) — and
# referenced here by name only.

# -- The SlapdMesh: the sites and the fabric between them, and nothing else.
mesh:
  # ridLayout — the shape of the RID matrix (ADR-031 decision 5). Omit it to take
  # the operator's defaults, which is what almost every mesh should do.
  #
  # It lives here, once, because it is MESH-SCOPED: every site must compute the
  # same number for the same provider, so a layout that differed between sites
  # would make the same rid mean different things at each. This chart is applied
  # unchanged everywhere, which is what makes that true — ADR-031 decision 5
  # relies on exactly that, since the operator-side parity check is not built yet.
  #
  # podsPerSite bounds a site's read-write pod count; maxSites bounds a site's
  # serverIDIndex (NOT the number of sites — indices are retired rather than
  # reused, so a long-lived mesh spends them). A segment is podsPerSite+maxSites
  # wide and the space is 999, so the two also set how many databases fit:
  # 8+12 → 49, 4+6 → 99, 8+16 → 41.
  #
  # Changing it renumbers the mesh: one cn=config write per pod per database, no
  # restart, no resync.
  #
  # ridLayout:
  #   podsPerSite: 8
  #   maxSites: 12

  # -- Name of the SlapdMesh object. Referenced by the SlapdCluster's meshRef.
  name: slapd-mesh

  # -- REQUIRED. Every site of the mesh. There is deliberately no default: a
  # chart that quietly rendered a one-site mesh would be wrong in the way that
  # is hardest to notice, and it would hand every site the same serverID stride slot
  # the moment a second one appeared.
  #
  # Each entry is written from the point of view of every OTHER site — it says
  # how to reach and trust THIS site — which is what keeps the object identical
  # everywhere.
  #
  #   name            (required) matched verbatim against the operator's
  #                   SITE_NAME: trimmed, never case-folded. `site-a` and
  #                   `SITE-A` are two different sites.
  #   serverIDIndex   (required) this site's slot in the serverID space. The
  #                   base is index * 16, and ADR-017's
  #                   serverIDBase + ordinal + 1 then gives each pod its own:
  #                   index 2, pod ordinal 3 -> sid 36, which a CSN renders as
  #                   024 — site digit, pod digit, no arithmetic. The stride is
  #                   hex for exactly that reason (ADR-028 amendment).
  #                   Explicit, never the list position — olcServerID is baked
  #                   into every CSN a pod has written, so a site whose number
  #                   moves splits its history across two sids. Unique, 0..255,
  #                   gaps are legal and are how a site is decommissioned.
  #   endpoint        (optional) the site's Kubernetes API URL on the network
  #                   the other sites reach it over. Read by the bootstrap CLI
  #                   and `slctl mesh verify`, not by the operator.
  #   kubeconfigSecret (optional) Secret holding a kubeconfig for this site's
  #                   API server, present at every OTHER site. Defaults by
  #                   convention to "<site name>-kubeconfig" with key
  #                   "kubeconfig"; set it when External Secrets or a platform
  #                   convention names it otherwise.
  #   caSecretName    (optional) Secret holding this site's CA under "ca.crt",
  #                   present at every OTHER site. Defaults to "<site name>-ca".
  #
  # A three-site mesh, which is the shape to copy:
  #
  # sites:
  #   - name: site-a
  #     serverIDIndex: 0
  #     endpoint: https://api.site-a.k8s.example:6443
  #   - name: site-b
  #     serverIDIndex: 1
  #     endpoint: https://api.site-b.k8s.example:6443
  #   - name: site-c
  #     serverIDIndex: 2
  #     endpoint: https://api.site-c.k8s.example:6443
  sites: []

  # -- How cross-site syncrepl peers are addressed. A property of the fabric,
  # which is why it lives on the mesh and not on the cluster: two clusters on
  # one mesh cannot sensibly disagree about whether pod CIDRs are routed.
  #
  #   pod-routed (default, ADR-016) — peers are addressed by their primary pod
  #     IP. Needs no NAD and no secondary NIC, and requires the pod CIDRs to be
  #     natively routed between sites. When they are not, peers are simply
  #     unreachable and say so; nothing silently half-works.
  #   multus (ADR-007) — a dedicated replication network; set multusNetwork to
  #     the NetworkAttachmentDefinition, "namespace/name" recommended.
  network:
    mode: pod-routed
    # multusNetwork: "infra/replication-net"
    # useForInCluster: false     # multus only; in-cluster syncrepl over net1 too

  # -- Mesh-wide trust material. Per-site CAs live on the site entries above,
  # because a CA belongs to a site: site B's CA is site B's CA whichever LDAP
  # cluster is talking to it.
  #
  # Declarative only today — nothing in the operator consumes issuerRef, since
  # certificate bootstrap is a CLI run once per site pair (ADR-028 §7). It is
  # carried so the mesh stays the single description of the fabric.
  trust: {}
  #  issuerRef:
  #    name: slaptain-ca
  #    kind: ClusterIssuer
  #    group: cert-manager.io

# -- The SlapdCluster. Infrastructure only; databases and schemas are below
# (ADR-004).
cluster:
  # -- Name of the SlapdCluster, and therefore of its Services. "slapd" keeps
  # SLAPD_HOST=slapd working the same way it does for every other chart here.
  # Object names come from this value and never from the Helm release name —
  # see the header for why.
  name: slapd

  # -- Narrow this cluster to a SUBSET of the mesh's sites, so cluster X may
  # span sites A+B while cluster Y on the same mesh spans A+B+C. Empty means
  # every site, which is what a cluster gets when it says nothing. The selector
  # narrows the derived PEER set only; it never touches the serverID stride slot,
  # which is mesh-wide by construction.
  sites: []

  # -- Container images. Left empty on purpose: the operator then defaults both
  # images to its own registry and tag, so a site runs the slapd that matches
  # the operator it is running. Set only to pin.
  images: {}
  #  slapd:
  #    repository: ghcr.io/chuck-chuck-chuck-net/slaptain/slapd
  #    tag: latest
  #    pullPolicy: IfNotPresent
  #  init:
  #    repository: ghcr.io/chuck-chuck-chuck-net/slaptain/slapd-init
  #    tag: latest
  #    pullPolicy: IfNotPresent
  #  exporter:      # the monitoring sidecar; its own version line. Empty = the
  #                 # slapd-exporter release the operator was built against,
  #                 # beside the operator's registry; an operator upgrade
  #                 # leaves it alone unless that release moved.
  #    repository: ghcr.io/chuck-chuck-chuck-net/slaptain/slapd-exporter
  #    tag: 0.0.1
  #    pullPolicy: IfNotPresent

  ldap:
    # -- TLS. Cross-site syncrepl runs over ldaps, so this stays on for a mesh.
    # The Secret is per-site material (its cert carries that site's names) but
    # the NAME is mesh-scoped, which is why naming it here is legal.
    tls:
      enabled: true
      secretName: "slapd-tls"
    # -- cn=config admin credentials. The operator auto-generates a
    # <cluster.name>-config-password Secret when this is empty. That Secret is
    # node-local in effect — cn=config is never replicated (ADR-002) — so sites
    # need not share it.
    cnConfigCredentials:
      secretName: ""

  # -- Slapd replicas PER SITE. 1 means the site has no local HA and relies
  # entirely on its peers; raise it for per-site autonomy, which is the whole
  # point of the architecture. Commented out means the operator's default (1),
  # which is where this sits because the right number depends on storage the
  # chart cannot see.
  # replicas: 1

  # -- Read-only consumer replicas per site. Requires replication.enabled.
  # readReplicas: 0                 # unset → the operator default (0)

  # -- slapd -d debug bitmask. Commented out means the operator's default
  # (16640 = stats + sync, ADR-024) — the value a replication incident is
  # diagnosed from. An explicit 0 silences slapd entirely.
  # logLevel: 0

  # -- Persistent storage. Persistence is mandatory (ADR-013); there is no
  # opt-out. Storage classes are named, not provisioned — every site must have
  # a class by this name, which is a constraint the mesh imposes on the sites
  # rather than a per-site value.
  # Commented out because restating a default in the rendered CR freezes it at
  # install time — see charts/slapd. Whatever you DO set applies at every site.
  # persistence:
  #   data:
  #     size: 5Gi                   # unset → the operator default (5Gi)
  #     accessMode: ReadWriteOnce   # unset → the operator default (ReadWriteOnce)
  #     storageClass: ""            # unset → the site's default StorageClass
  #   config:
  #     size: 1Gi                   # unset → the operator default (1Gi)
  #   accesslog:
  #     size: 1Gi                   # unset → the operator default (1Gi)

  # -- Replication. On by default: this is the mesh chart, and a mesh with
  # replication off is a set of unrelated clusters.
  #
  # serverIDBase, externalPeers and network are NOT here and cannot be set.
  # The operator derives all three from mesh + SITE_NAME (ADR-028 §4), and
  # setting one alongside meshRef is refused outright with MeshResolved=False —
  # deliberately, because resolving that ambiguity silently is how a serverID
  # collision gets in. The network lives on mesh.network above.
  replication:
    enabled: true
    # -- "peer" (default) or "consumer-only" (ADR-010, hot migration).
    mode: ""
    # -- TCP keepalive for syncrepl connections, "idle:probes:interval".
    keepalive: ""
    # -- Syncrepl retry interval, "<interval> <count>" pairs.
    # retry: "10 +"                 # unset → the operator default ("10 +")

    # -- Cross-site fan-out: how many remote pods each local pod opens a
    # syncrepl connection to, per peer site. Unset → 1.
    #
    # This is the one peer-level knob a mesh cluster can reach: externalPeers
    # is DERIVED from the SlapdMesh and setting it here is refused, so the
    # per-peer form of this field is out of reach (ADR-028 amendment).
    #
    # It buys link REDUNDANCY, not coverage. At 1 each local pod has a single
    # path to each peer site; losing the remote pod at the far end costs that
    # pod its cross-site path until discovery repoints — the 130-268s ADR-016
    # window. The data still arrives through this pod's in-cluster peers. Raise
    # it to buy a second route, at the price of more connections and more
    # refresh traffic on every peer. Capped at the peer's pod count.
    # replicasPerPeer: 2

  # -- Client-facing Service. Every key matches the operator's default, so
  # uncomment only what you change. Whatever you set applies at EVERY site —
  # that is the point of the chart, and a per-site Service type means the sites
  # are not interchangeable.
  # service:
  #   type: ClusterIP               # unset → the operator default (ClusterIP)
  #   ldapPort: 389                 # unset → the operator default (389)
  #   ldapsPort: 636                # unset → the operator default (636)
  #   annotations: {}               # LB-controller hints (MetalLB/Cilium pool, NLB attrs)

  # -- Compute resources for the slapd container.
  resources: {}
  #  requests:
  #    cpu: 100m
  #    memory: 128Mi
  #  limits:
  #    memory: 512Mi

  # -- Image pull secrets for private registries.
  imagePullSecrets: []
  #  - name: ghcr-pull-secret

  # -- spec.monitoring (ADR-033 Surface 3): the slapd exporter sidecar, serving
  # openldap_* metrics on :9330/metrics. Opt-in; flipping it rolls the pods once.
  # Passed through only when set — unset leaves the decision to the operator.
  monitoring: {}
  #  enabled: true
  #  resources: {}    # the exporter sidecar's own; no default, unset declares nothing

  # -- spec.placement (ADR-043): where this cluster's pods are allowed to land.
  # Every key is a raw Kubernetes pod-spec field, passed through verbatim to
  # both the read-write and the read-only pod template.
  #
  # It matters more here than for a typical workload: the PVCs are
  # ReadWriteOnce and, on local storage with WaitForFirstConsumer, the volume
  # binds wherever the pod first lands and pins the pod to that node for the
  # life of the PVC. The FIRST scheduling decision is the only one.
  #
  # THIS FILE IS APPLIED IDENTICALLY AT EVERY SITE (ADR-028 §5), and that is
  # the point of the chart rather than a convenience. So select on labels every
  # site carries. A nodeSelector or nodeAffinity naming one site's node, rack
  # or zone is wrong at the others, and nothing here or in the operator will
  # say so — the sites will simply differ. If one site genuinely needs its own
  # placement, that is a per-site values override, taken deliberately.
  #
  # Leaving this empty is the normal case, and it is site-safe by construction:
  # the operator then generates ONE spread constraint per fleet (maxSkew 1 over
  # kubernetes.io/hostname, ScheduleAnyway, selecting that fleet of this
  # cluster alone), which names no site. See docs/PLACEMENT.md.
  placement: {}
  #  # Setting this REPLACES the generated default entirely — never merged. An
  #  # explicit empty list ([]) is how you ask for NO spread constraint at all;
  #  # leaving the key out is how you keep the operator's.
  #  #
  #  # Prefer whenUnsatisfiable: ScheduleAnyway. DoNotSchedule can strand a pod
  #  # permanently here: once its PV is bound the pod may use exactly one node,
  #  # and a hard constraint refusing that node leaves it Pending forever.
  #  topologySpreadConstraints:
  #    - maxSkew: 1
  #      topologyKey: topology.kubernetes.io/zone
  #      whenUnsatisfiable: ScheduleAnyway
  #      labelSelector:
  #        matchLabels:
  #          app.kubernetes.io/instance: ldap
  #  nodeSelector:
  #    node-role.kubernetes.io/ldap: ""
  #  # The NODE half of the affinity struct only; the pod half is reserved for
  #  # the operator (ADR-043 decision 2).
  #  nodeAffinity:
  #    requiredDuringSchedulingIgnoredDuringExecution:
  #      nodeSelectorTerms:
  #        - matchExpressions:
  #            - key: node-role.kubernetes.io/ldap
  #              operator: Exists
  #  tolerations:
  #    - key: dedicated
  #      operator: Equal
  #      value: ldap
  #      effect: NoSchedule
  #  priorityClassName: system-cluster-critical

  # -- EXPERIMENTAL (ADR-039 tier 2). Off by default, and the project does not
  # yet assert it is fit for production: what is missing is operating
  # experience, not code. It is implemented, measured and honestly reported —
  # and it needs a slapd carrying our accesslog-purge-phase patch, couples your
  # write endpoint to each provider's own purge schedule, and only pays for
  # clients whose write connections are short-lived. Feedback wanted, positive
  # or negative. Evidence and sizing: docs/PURGE-ROTATION.md, ADR-037.
  #
  # -- spec.rotation (ADR-037): the accesslog purge runs where the writes are
  # not. slapd purges an accesslog in one unpaced loop holding that
  # environment's only LMDB writer, and every client write appends to the same
  # environment — so a provider purging its own log blocks its own writes.
  # Turning this on gives each read-write pod its own purge phase on one
  # absolute grid, and publishes a second Service, <cluster.name>-write, that
  # follows the grid and always names a pod that is not purging.
  #
  # MESH-SCOPED, like everything else in this file. These values name no site,
  # no endpoint and no pod — they are a schedule SHAPE, and every site derives
  # the same grid from the same cluster.replicas. Do not reach for a per-site
  # value here: sites rotating on different grids would each still be
  # internally correct, so the divergence would pass every parity check the
  # mesh has (ADR-028 §3).
  #
  # The grid is per SITE, over that site's own read-write pods. A write sent to
  # another site still lands wherever the client sent it — a mesh accepts a
  # write at any provider by design, and the endpoint is a recommendation
  # rather than an enforcement.
  #
  # Off by default; nothing about an installed mesh changes until you set it,
  # and <cluster.name>-write is not created at all. Two prerequisites, both
  # real: a slapd image carrying the purge-phase patch (`slapd -VV` must end
  # in +slaptain<N>; +pure<N> carries none of our patches), and clients that
  # open SHORT-LIVED connections — a Service steers
  # new connections and never re-wires an established one, so a pooling client
  # needs a maximum connection lifetime short relative to slotLength to benefit
  # at all. See docs/TUNING.md for sizing and docs/MULTI-SITE.md for the mesh
  # install.
  rotation: {}
  #  enabled: true
  #  # -- Which of the rotation's two halves run. Unset is PurgeAndWrite, the
  #  # coupled form and the ONLY one measured end to end — leave it unset unless
  #  # you are deliberately running an arm nobody has. PurgeOnly staggers the
  #  # purges and leaves the endpoint alone (measured INERT for writer
  #  # throughput; the fleet read capacity it might buy is unmeasured).
  #  # WriteOnly moves the endpoint and declares no purge schedule, so
  #  # accesslogPurge.interval is its companion rather than a conflict (never
  #  # measured as its own arm; the rationale is ADR-036/ITS#9580 dormancy).
  #  # In both split modes, slotsFromWriteToPurge and leadTime have no referent
  #  # and setting them is REPORTED, not ignored.
  #  mode: PurgeAndWrite
  #  # t: how long each pod holds the write endpoint, and the spacing between
  #  # neighbouring pods' purge phases. REQUIRED when enabled, NO default. Every
  #  # pod's purge interval becomes replicas × slotLength, pod k purges at
  #  # k × slotLength. Whole seconds — olcAccessLogPurge counts in [ddd+]hh:mm[:ss].
  #  slotLength: "6h"
  #  # v: the SIGNED displacement in slots from a pod's write slot to its own
  #  # purge slot, taken mod replicas. Unset → 1, "purge the slot after
  #  # writing". -1 is "purge the slot before writing" and survives a scale
  #  # event. The rule is `v mod replicas != 0` — zero and every multiple put
  #  # the write on the purging pod and are refused by name. Leave unset unless
  #  # you are measuring.
  #  slotsFromWriteToPurge: 1
  #  # d: how long BEFORE each slot boundary the write endpoint moves. Unset → 0,
  #  # the endpoint moving AT the boundary, which is what every cluster did before
  #  # this field existed. Measured: with the writes following the endpoint, 99.9%
  #  # of the throughput loss lands in the first 30 s after a boundary, because the
  #  # pod that stops taking writes starts purging at the same instant and every
  #  # connection that has not aged out delivers into an active purge. Set it ABOVE
  #  # your clients' maximum connection lifetime; the operator cannot know that
  #  # number and recommends none. Must be below (replicas - 1) x slotLength.
  #  leadTime: "60s"

  # -- FORM A of the purge schedule: one interval, every pod sweeping its
  # accesslog journals at the same instants. This is what every mesh has always
  # run; the operator's default of 24h is what the old two-token
  # "7+00:00 1+00:00" spelled, so leave it unset unless you want a different
  # sweep rate.
  #
  # It does NOT remove the write stall — every provider purges together,
  # including the one taking writes. `rotation` above is the form that moves
  # the purge off the write path, and the two are MUTUALLY EXCLUSIVE: setting
  # both is refused with a condition naming them.
  #
  # Mesh-scoped like everything else here: byte-identical at every site, and
  # each site's pods purge on their own absolute grid (ADR-028 §3).
  #
  # What each database KEEPS is the database's — see
  # databases[].spec.replication.accesslogPurge.retention.
  accesslogPurge: {}
  #  interval: "24h"

# -- Keep the SlapdDatabase and SlapdSchema objects when the release is removed
# (`helm.sh/resource-policy: keep`). On by default: a database is the
# declaration of a directory that holds data, and how much a `helm uninstall`
# costs otherwise depends on each database's cleanupPolicy — Retain leaves it
# serving but unmanaged, Delete tears it off every pod (ADR-005). On a mesh the
# peers keep replicating meanwhile, so an uninstall that looked local shows up
# as a parity divergence (ADR-028).
#
# Set false only for an install that is genuinely disposable. Note the Helm
# consequence of true: kept objects are orphaned from the release, so a later
# install adopts them (meta.helm.sh/release-name + -namespace) rather than
# creating them.
retainOnUninstall: true

# -- SlapdDatabases. Each entry is {name, spec}; spec is passed through to the
# CR verbatim, so anything valid on a SlapdDatabase is valid here. clusterRef is
# pinned by the chart to cluster.name and must not be set.
#
# The one rule the chart enforces: on a mesh with more than one site, a database
# that declares a seed must also declare seed.site. Exactly one site creates the
# entries and the others receive them by replication. Without it every site
# seeds, and one pod is left with a permanent hidden glue suffix — invisible to
# ordinary searches, clean on every CSN health read, and every backup taken from
# that pod unrestorable (ADR-025). The chart refuses to render rather than let
# that be applied N times.
databases: []
#  - name: example-db
#    spec:
#      suffix: "dc=example,dc=org"
#      acls:
#        - >-
#          to attrs=userPassword
#          by self write
#          by anonymous auth
#          by * none
#        - >-
#          to *
#          by * read
#      indices:
#        - "objectClass eq"
#        - "uid eq,sub"
#        - "entryCSN eq"
#        - "entryUUID eq"
#      replication:
#        ridSegment: 0         # unique per database within the mesh; 0 is legal and is the natural first (ADR-031)
#        deltaSync: true
#        syncprovCheckpoint: "500 15"
#        accesslogPurge:                   # what to KEEP; WHEN to purge is the cluster's (ADR-024 R6)
#          retention: "48h"                # unset → 168h (7 days); enabled: false never purges
#      seed:
#        site: site-a          # the founder; every other site withholds
#        entries:
#          - |
#            dn: dc=example,dc=org
#            objectClass: top
#            objectClass: dcObject
#            objectClass: organization
#            o: example
#            dc: example
#      cleanupPolicy: Retain

# -- SlapdSchemas. Same shape: {name, spec}, spec passed through verbatim,
# clusterRef pinned by the chart.
#
# Schemas are additive and desired-minimum (ADR-006), and a site missing one
# diverges silently: entries replicate in carrying an objectClass that site does
# not know, the add fails, and that site quietly lacks entries the others have.
# Shipping them in this bundle is what makes "identical everywhere" a property
# of one artifact.
schemas: []
#  - name: example-schema
#    spec:
#      priority: 100
#      attributeTypes:
#        - >-
#          ( 1.3.6.1.4.1.99999.1.1.1
#            NAME 'exampleContextId'
#            DESC 'Numeric context identifier'
#            EQUALITY integerMatch
#            SYNTAX 1.3.6.1.4.1.1466.115.121.1.27
#            SINGLE-VALUE )
#      objectClasses:
#        - >-
#          ( 1.3.6.1.4.1.99999.1.2.1
#            NAME 'exampleUser'
#            DESC 'Example application user'
#            SUP inetOrgPerson
#            STRUCTURAL
#            MAY ( exampleContextId ) )
