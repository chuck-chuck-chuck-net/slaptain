# Default values for slapd.

images:
  slapd:
    repository: registry.internal/slaptain/slapd
    tag: latest
    pullPolicy: Always
  init:
    repository: registry.internal/slaptain/slapd-init
    tag: latest
    pullPolicy: Always

ldap:
  domain: "dc=example,dc=org"
  forceRebootstrap: false
  tls:
    enabled: true
    secretName: "slapd-tls"

# Password secret.
# The chart creates a Secret named <fullname>-passwords with the hashes below,
# unless existingSecret is set — in which case no Secret is created and the named
# Secret is referenced directly.  It must contain admin-password-hash and
# root-password-hash keys.
passwords:
  existingSecret: ""
  adminPasswordHash: ""  # required; generate with: slappasswd -h {SSHA} -s yourpassword
  rootPasswordHash: ""   # required

persistence:
  enabled: true
  config:
    size: 1Gi
    storageClass: ""
    accessMode: ReadWriteOnce
  data:
    size: 5Gi
    storageClass: ""
    accessMode: ReadWriteOnce

securityContext:
  runAsUser: 1024
  runAsGroup: 1024
  fsGroup: 1024

# slapd -d log level. 0 = no debug output. See slapd(8) for levels.
logLevel: 0

service:
  type: ClusterIP
  ldapPort: 389
  ldapsPort: 636
  # nodePort: 31024

resources: {}
