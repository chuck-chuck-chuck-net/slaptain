# Default values for slapd.
#
# This chart deploys ONE slapd instance and nothing else — no operator, no CRDs,
# everything configured here. It is the helm-centric option for a single
# directory server, and it is complete for that: TLS, credentials, persistence
# and a restricted-PSA security context.
#
# What it deliberately does not do, because these need a control plane that
# reconciles cn=config per pod: replication (N-way multi-master or read-only
# replicas), multi-site meshes, declarative schemas and ACLs, and S3
# backup/restore. For any of those, install the operator and use
# charts/slapd-cluster (one site) or charts/slapd-mesh (several) instead.

images:
  slapd:
    repository: ghcr.io/chuck-chuck-chuck-net/slaptain/slapd
    # -- Image tag. Empty string falls back to the chart's appVersion, which is
    # set at package time from the git tag (e.g. v0.2.0) and matches the
    # published image tag — see Makefile target charts-package. There is no
    # `latest` tag in the registry: images are pushed under their git tag only.
    tag: ""
    pullPolicy: IfNotPresent
  init:
    repository: ghcr.io/chuck-chuck-chuck-net/slaptain/slapd-init
    # -- See images.slapd.tag. Pin both images or neither — slapcat/slapadd in
    # the init container must match the slapd version (docs/OPENLDAP-VERSIONS.md).
    tag: ""
    pullPolicy: IfNotPresent

# imagePullSecrets: list of LocalObjectReferences for pulling images from a
# private registry. Alternative: patch the default ServiceAccount in the
# workload namespace with its own imagePullSecrets and leave this empty.
imagePullSecrets: []
# - name: ghcr-pull-secret

ldap:
  domain: "dc=example,dc=org"
  tls:
    enabled: true
    secretName: "slapd-tls"

# Password secret.
# The chart creates a Secret named <fullname>-passwords with the plaintexts below,
# unless existingSecret is set — in which case no Secret is created and the named
# Secret is referenced directly.  It must contain admin-password and root-password keys.
# Hashes are computed at runtime by slappasswd inside the init container.
passwords:
  existingSecret: ""
  adminPassword: ""  # required plaintext admin password
  rootPassword: ""   # required plaintext config DB password

persistence:
  enabled: true
  config:
    size: 1Gi
    storageClass: ""
    accessMode: ReadWriteOnce
  data:
    size: 5Gi
    storageClass: ""
    accessMode: ReadWriteOnce

# Pod-level securityContext. Defaults are PSA "restricted"-compliant out of the box.
securityContext:
  runAsUser: 1024
  runAsGroup: 1024
  fsGroup: 1024
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

# slapd -d log level. 0 = no debug output. See slapd(8) for levels.
logLevel: 0

service:
  type: ClusterIP
  ldapPort: 389
  ldapsPort: 636
  # nodePort: 31024

resources: {}
