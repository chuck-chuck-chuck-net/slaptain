# Default values for slapd.
# Deploys a SlapdCluster CR; the slaptain operator must be installed first.
# Databases and schemas remain separate OBJECTS (SlapdDatabase / SlapdSchema,
# ADR-004) — apply them as plain CRs, or declare them under `databases:` /
# `schemas:` at the bottom of this file and let the chart render them. Both are
# supported; the second exists so that moving to a mesh does not change how you
# declare them (charts/slapd-mesh has rendered them since ADR-028).
#
# For a MULTI-SITE deployment use the slapd-mesh chart instead — it renders this
# same SlapdCluster plus the SlapdMesh the operator derives the cross-site
# wiring from, and it is applied byte-identically at every site (ADR-028).
#
# COMMENTED-OUT KEYS ARE NOT MISSING FEATURES. This chart emits only the fields
# you set, and every commented default below is the operator's own — restating
# it in the rendered CR would freeze it at install time, so a later release's
# changed default would never reach an existing cluster. Uncomment to override;
# `--set` works on every key whether or not it is uncommented here.

# -- Override the resource name prefix. Empty uses the chart name ("slapd"), so
# `helm install slapd` yields objects named plainly "slapd" and SLAPD_HOST=slapd
# resolves.
nameOverride: ""

# -- LDAP configuration.
ldap:
  # -- TLS/LDAPS. Enabled by DEFAULT here, unlike the operator (which defaults
  # to off): a directory server should not ship plaintext-by-default. This is
  # the ONLY place this chart holds an opinion instead of deferring to the
  # operator — everything else it renders is something you set.
  #
  # PREREQUISITE: the Secret named below must exist before install, carrying
  # tls.crt and tls.key (plus ca.crt for a private CA). cert-manager, your own
  # PKI, or `make gencert` from a clone of the repository all produce one. With
  # TLS enabled and the Secret absent, pods stay in ContainerCreating.
  # Set enabled: false for a plaintext deployment.
  tls:
    enabled: true
    secretName: "slapd-tls"
  # -- cn=config admin credentials.
  # The operator auto-generates a <name>-config-password Secret when not set.
  # To supply your own, create a Secret with a "root-password" key.
  cnConfigCredentials:
    secretName: ""

# -- Container images. Every field is optional and EMPTY IS THE RECOMMENDED
# SETTING: the operator then derives both images from its own image and tag, so
# slapd, slapd-init and the operator that drives them stay on one version. A
# repository/tag pinned here overrides that for the field it names — useful for
# a private mirror or for the `-ol26` pair (OpenLDAP 2.6, hot-migration interop;
# both images must be pinned or neither — see docs/OPENLDAP-VERSIONS.md).
images:
  slapd:
    repository: ""
    tag: ""
    pullPolicy: ""
  init:
    repository: ""
    tag: ""
    pullPolicy: ""
  # The exporter sidecar (monitoring.enabled), its own image and version line.
  # Empty means the slapd-exporter release the operator was built against, in
  # the operator's registry; an operator upgrade leaves it alone unless that
  # release moved. Pin it to run another exporter version.
  exporter:
    repository: ""
    tag: ""
    pullPolicy: ""

# -- Number of read-write replicas. Set replication.enabled=true for >1.
# replicas: 1                       # unset → the operator default (1)

# -- Number of read-only consumer replicas. Requires replication.enabled=true.
# readReplicas: 0                   # unset → the operator default (0)

# -- slapd -d debug bitmask. 0 silences slapd entirely; see the
# SlapdCluster.spec.logLevel godoc for the full bit table.
# logLevel: 0                       # unset → the operator default (16640, stats+sync; ADR-024)

# -- Persistent storage. Persistence itself is mandatory per ADR-013 — these
# keys size it, they do not enable it. The accesslog PVC is provisioned on every
# read-write pod regardless of replication state (its volumeClaimTemplate is
# immutable, so it cannot be added later without recreating the StatefulSet).
#
# SIZE data TO YOUR DIRECTORY BEFORE PRODUCTION. The default is a starting
# point, and the PVC — not spec.maxSize — is what actually stops a database.
# See docs/TUNING.md.
# persistence:
#   data:
#     size: 5Gi                     # unset → the operator default (5Gi)
#     accessMode: ReadWriteOnce     # unset → the operator default (ReadWriteOnce)
#     storageClass: ""              # unset → the cluster's default StorageClass
#   config:
#     size: 1Gi                     # unset → the operator default (1Gi)
#   accesslog:
#     size: 1Gi                     # unset → the operator default (1Gi)

# -- Client-facing Service. Every key matches the operator's default, so
# uncomment only what you change (e.g. type: LoadBalancer).
# service:
#   type: ClusterIP                 # unset → the operator default (ClusterIP)
#   ldapPort: 389                   # unset → the operator default (389)
#   ldapsPort: 636                  # unset → the operator default (636)
#   annotations: {}                 # LB-controller hints (MetalLB/Cilium pool, NLB attrs)

# -- Replication. N-way multi-master delta-syncrepl.
# Set enabled=true together with replicas>1 to activate.
# Per-database replication settings (deltaSync, ridSegment, etc.) are on SlapdDatabase CRs.
#
# FOR A MULTI-SITE MESH, USE THE slapd-mesh CHART INSTEAD. This chart writes one
# site's SlapdCluster by hand; the mesh chart describes the sites once and lets
# the operator derive each site's serverIDBase, its external peers, the network
# mode and the trust wiring (ADR-028, docs/MULTI-SITE.md). The hand-written form
# below stays supported — it is what the mesh derives, and it is still the way
# to peer with something that is not a slaptain cluster (ADR-011).
replication:
  enabled: false
  # -- TCP keepalive for syncrepl connections. Format: "idle:probes:interval".
  # keepalive: "240:3:30"           # unset → the operator default (240:3:30; docs/TUNING.md)
  # -- Syncrepl retry interval. Format: "<interval> <count>" pairs.
  # retry: "10 +"                   # unset → the operator default ("10 +")
  # -- Cross-cluster replication network. Selects how remote peers are addressed.
  # network:
  #   mode: pod-routed          # ADR-016: peers via primary pod IP; no NAD/secondary NIC.
  #                             # Requires pod CIDRs routed between sites.
  #   # -- or Multus (ADR-007); slapd pods get a secondary NIC for replication:
  #   mode: multus              # (inferred when multusNetwork is set)
  #   multusNetwork: "infra/replication-net"  # NAD reference (namespace/name recommended)
  #   useForInCluster: false                  # Use Multus IPs for in-cluster syncrepl too
  # When mode is unset it defaults to pod-routed, unless multusNetwork is set (then multus).

  # -- Cross-cluster external peers.
  # Each peer requires a name and either uri (single-endpoint) or podAddresses (per-pod Multus).
  externalPeers: []
  # Single-endpoint mode (NodePort / LoadBalancer):
  # - name: site-b
  #   uri: "ldaps://ldap.site-b.example.com:636"
  #   tlsSecretName: "site-b-ca"
  #   bindPasswordSecretName: "site-b-replication-password"
  #   # bindDN is normally OMITTED: the operator binds as the node-local
  #   # identity cn=repl-<database>,cn=slaptain-auth (ADR-027). Pin it to the
  #   # peer's legacy cn=replication,<suffix> only while that peer still runs a
  #   # pre-ADR-027 operator — that migration window is one-directional.
  #
  # Per-pod Multus mode (replication network, ADR-007):
  # - name: site-b
  #   podAddresses:
  #     - "192.168.99.128"   # site-b slapd-0
  #     - "192.168.99.129"   # site-b slapd-1
  #   port: 1025
  #   tlsSecretName: "site-b-ca"
  #   bindPasswordSecretName: "site-b-replication-password"

# -- Compute resources for the slapd container. Unset means no requests or
# limits; see docs/TUNING.md for sizing.
resources: {}
#  requests:
#    cpu: 100m
#    memory: 128Mi
#  limits:
#    memory: 512Mi

# -- List of image pull secrets for private registries.
imagePullSecrets: []
# - name: ghcr-pull-secret

# -- spec.monitoring (ADR-033 Surface 3): the slapd exporter sidecar, serving
# openldap_* metrics on :9330/metrics. Opt-in; flipping it rolls the pods once.
# Passed through only when set — unset leaves the decision to the operator.
monitoring: {}
#  enabled: true
#  resources: {}    # the exporter sidecar's own; no default, unset declares nothing

# -- spec.placement (ADR-043): where this cluster's pods are allowed to land.
# Every key is a raw Kubernetes pod-spec field, passed through verbatim to both
# the read-write and the read-only pod template.
#
# This matters more here than for a typical workload. The PVCs are ReadWriteOnce
# and, on local storage with WaitForFirstConsumer, the volume binds wherever the
# pod first lands and pins the pod to that node for the life of the PVC — so the
# FIRST scheduling decision is the only one, and a bad spread is corrected only
# by deleting that pod's PVCs and rebuilding it from replication.
#
# Leaving this empty is the normal case: the operator then generates ONE spread
# constraint per fleet (maxSkew 1 over kubernetes.io/hostname, ScheduleAnyway,
# selecting that fleet of this cluster alone), so writers spread among writers
# and readers among readers. See docs/PLACEMENT.md.
placement: {}
#  # Setting this REPLACES the generated default entirely — it is never merged.
#  # An explicit empty list ([]) is how you ask for NO spread constraint at all;
#  # leaving the key out is how you keep the operator's.
#  #
#  # Prefer whenUnsatisfiable: ScheduleAnyway. DoNotSchedule can strand a pod
#  # permanently here: once its PV is bound the pod may use exactly one node,
#  # and a hard constraint refusing that node leaves it Pending forever.
#  topologySpreadConstraints:
#    - maxSkew: 1
#      topologyKey: topology.kubernetes.io/zone
#      whenUnsatisfiable: ScheduleAnyway
#      labelSelector:
#        matchLabels:
#          app.kubernetes.io/instance: slapd
#  nodeSelector:
#    node-role.kubernetes.io/ldap: ""
#  # The NODE half of the affinity struct only; the pod half is reserved for the
#  # operator (ADR-043 decision 2).
#  nodeAffinity:
#    requiredDuringSchedulingIgnoredDuringExecution:
#      nodeSelectorTerms:
#        - matchExpressions:
#            - key: node-role.kubernetes.io/ldap
#              operator: Exists
#  # A toleration removes a node's veto; it does not attract a pod there. Pair it
#  # with nodeSelector or nodeAffinity when you mean "run there, and only there".
#  tolerations:
#    - key: dedicated
#      operator: Equal
#      value: ldap
#      effect: NoSchedule
#  priorityClassName: system-cluster-critical

# -- EXPERIMENTAL (ADR-039 tier 2). Off by default, and the project does not yet
# assert it is fit for production: what is missing is operating experience, not
# code. It is implemented, measured and honestly reported — and it needs a slapd
# carrying our accesslog-purge-phase patch, couples your write endpoint to each
# provider's own purge schedule, and only pays for clients whose write
# connections are short-lived. Feedback wanted, positive or negative.
# Evidence and sizing: docs/PURGE-ROTATION.md, ADR-037.
#
# -- spec.rotation (ADR-037): the accesslog purge runs where the writes are not.
#
# slapd purges an accesslog in one unpaced loop holding that environment's only
# LMDB writer, and every client write appends to the same environment — so a
# provider purging its own log blocks its own writes. Turning this on gives each
# read-write pod its own purge phase on one absolute grid, and publishes a second
# Service, <release>-write, that follows the grid and always names a pod that is
# not purging.
#
# Off by default and nothing changes until you set it: an existing cluster keeps
# the purge schedule it has, and <release>-write is not created at all.
#
# PREREQUISITES, both of them real:
#
#   1. A slapd image carrying the purge-phase patch. The package revision
#      names the flavour, so `slapd -VV` must report a version ending in
#      +slaptain<N>; a build ending in +pure<N> carries none of our patches.
#      The phase is a third field of olcAccessLogPurge and is not
#      upstream. A pod whose slapd refuses it keeps a bounded journal and simply
#      does not take its phase, reported per database as PurgePhaseUnsupported.
#   2. CLIENTS THAT OPEN SHORT-LIVED CONNECTIONS, or whose pool caps connection
#      lifetime short relative to slotLength. A Kubernetes Service steers NEW
#      connections; it never re-wires an established one. A client holding a
#      connection for hours keeps writing to the pod it first reached however
#      often the endpoint moves, and no operator-side setting changes that. We
#      have not measured where the ratio stops paying, so no number is given.
#
# Writes sent anywhere but <release>-write stay perfectly legal — every pod is a
# provider. The endpoint is a recommendation, and the only cost of ignoring it is
# the stall this feature removes. Reads stay on <release> as before.
#
# Sizing is yours: see docs/TUNING.md for the capacity condition and what each
# condition reason on the CR is telling you.
rotation: {}
#  # -- Turn the rotation on. Opt-in; an explicit false is kept distinct from
#  # unset, so setting it now survives the default moving later. Mutually
#  # exclusive with accesslogPurge.interval below — the operator refuses both.
#  enabled: true
#  # -- Which of the rotation's two halves run. Unset is PurgeAndWrite, the
#  # coupled form and the ONLY one measured end to end — leave it unset unless
#  # you are deliberately running an arm nobody has. PurgeOnly staggers the
#  # purges and leaves the endpoint alone (measured INERT for writer
#  # throughput; the fleet read capacity it might buy is unmeasured).
#  # WriteOnly moves the endpoint and declares no purge schedule, so
#  # accesslogPurge.interval is its companion rather than a conflict (never
#  # measured as its own arm; the rationale is ADR-036/ITS#9580 dormancy).
#  # In both split modes, slotsFromWriteToPurge and leadTime have no referent
#  # and setting them is REPORTED, not ignored.
#  mode: PurgeAndWrite
#  # -- t: how long each pod holds the write endpoint, and the spacing between
#  # neighbouring pods' purge phases. REQUIRED when enabled, and there is NO
#  # default — a schedule is not something the operator may invent for you.
#  # Every pod's purge interval becomes replicas × slotLength and pod k purges at
#  # k × slotLength. A Go duration string; whole seconds, since olcAccessLogPurge
#  # counts in [ddd+]hh:mm[:ss].
#  slotLength: "6h"
#  # -- v: the SIGNED displacement in slots from a pod's write slot to its own
#  # purge slot, taken mod replicas. Unset → 1, "purge the slot after writing",
#  # which is the configuration ADR-037 prefers. -1 is "purge the slot before
#  # writing" and stays correct across a scale event, because it is read mod n.
#  # The rule is `v mod replicas != 0`: zero and every multiple put the write on
#  # the pod that is purging, and the operator refuses it by name. Leave it unset
#  # unless you are measuring.
#  slotsFromWriteToPurge: 1
#  # d: how long BEFORE each slot boundary the write endpoint moves. Unset → 0,
#  # the endpoint moving AT the boundary, which is what every cluster did before
#  # this field existed. Measured: with the writes following the endpoint, 99.9%
#  # of the throughput loss lands in the first 30 s after a boundary, because the
#  # pod that stops taking writes starts purging at the same instant and every
#  # connection that has not aged out delivers into an active purge. Set it ABOVE
#  # your clients' maximum connection lifetime; the operator cannot know that
#  # number and recommends none. Must be below (replicas - 1) x slotLength.
#  leadTime: "60s"

# -- spec.accesslogPurge: FORM A of the purge schedule — one interval, every pod
# sweeping its accesslog journals at the same instants.
#
# This is what every cluster has always run, and the operator's default of 24h
# is what the old two-token "7+00:00 1+00:00" spelled. Leave it unset unless you
# want a different sweep rate.
#
# It does NOT remove the write stall: every provider purges together, including
# the one taking writes, which is the arm ADR-037 measured at a 30 s stall per
# cycle. `rotation` above is the form that moves the purge off the write path,
# and the two are MUTUALLY EXCLUSIVE — setting both is refused with a condition
# naming them, never silently resolved by precedence.
#
# Shortening the interval does not help and was measured: 15 s against 5 min
# cost 18x the disk reads and took p99 from 2.1 ms to 143-230 ms for no gain.
#
# What each database KEEPS is the database's, not the cluster's — see
# databases[].replication.accesslogPurge.retention.
accesslogPurge: {}
#  # -- How often every pod sweeps. A Go duration string, whole seconds.
#  interval: "24h"

# -- Cross-site fan-out for spec.replication.externalPeers: how many remote pods
# each local pod opens a syncrepl connection to, per peer. Unset → 1. A per-peer
# externalPeers[].replicasPerPeer still wins where set. Buys link redundancy,
# not coverage — see the CRD field docs. Mostly of interest with externalPeers
# or a meshRef; harmless otherwise.
# replicasPerPeer: 2

# -- Keep the SlapdDatabase and SlapdSchema objects when the release is removed
# (`helm.sh/resource-policy: keep`).
#
# On by default, and it preserves the behaviour this chart had BEFORE it
# rendered databases at all: `helm uninstall slapd` took the SlapdCluster and
# left the database CRs standing, because they were separate objects nobody had
# handed to Helm. Without the annotation, gaining a convenience feature would
# have quietly made uninstall destructive — and how destructive depends on each
# database's cleanupPolicy (ADR-005): Retain leaves it serving but unmanaged,
# Delete tears it, its overlays and its accesslog DB off every pod.
#
# Removing a database is therefore a deliberate `kubectl delete slapddatabase`,
# which is the point at which cleanupPolicy is your decision rather than a side
# effect. The PVCs were never Helm's either way.
#
# The Helm consequence of true: kept objects are orphaned from the release, so a
# later install adopts them (meta.helm.sh/release-name + -namespace annotations)
# instead of creating them. Set false for a genuinely disposable install.
retainOnUninstall: true

# -- SlapdDatabases to create alongside the cluster. Each entry is {name, spec};
# spec is passed through to the CR verbatim, so anything valid on a
# SlapdDatabase is valid here. clusterRef is pinned by the chart and must not be
# set.
#
# Empty by default: declaring databases as plain CRs (kubectl apply, ADR-004)
# stays entirely supported and is what every existing install does. This exists
# so that moving from one site to a mesh does not change HOW you declare a
# database — charts/slapd-mesh has rendered them since ADR-028, and the
# single-site chart being poorer made the upgrade path rewrite your objects
# rather than add a mesh: block.
#
# The chart refuses to render two databases sharing a replication.ridSegment
# (ADR-031). That is the first of two layers, not the enforcement on its own: a CR
# applied by hand bypasses it; the operator refuses the same collision at reconcile.
databases: []
#  - name: example-db
#    spec:
#      suffix: dc=example,dc=org
#      rootDN: cn=admin,dc=example,dc=org
#      replication:
#        deltaSync: true
#        ridSegment: 1
#      seed:
#        entries:
#          - |
#            dn: dc=example,dc=org
#            objectClass: top
#            objectClass: dcObject
#            objectClass: organization
#            o: Example
#            dc: example

# -- SlapdSchemas to create alongside the cluster. Same {name, spec} shape and
# the same opt-in default. Schemas are additive and desired-minimum (ADR-006).
schemas: []
#  - name: example-schema
#    spec:
#      priority: 100
#      attributeTypes:
#        - >-
#          ( 1.3.6.1.4.1.99999.1.1.1
#            NAME 'exampleContextId'
#            DESC 'Numeric context identifier'
#            EQUALITY integerMatch
#            SYNTAX 1.3.6.1.4.1.1466.115.121.1.27
#            SINGLE-VALUE )
#      objectClasses:
#        - >-
#          ( 1.3.6.1.4.1.99999.1.2.1
#            NAME 'exampleUser'
#            SUP inetOrgPerson
#            STRUCTURAL
#            MAY ( exampleContextId ) )
