{{- /*
THE CHART DOES NOT RESTATE THE OPERATOR'S DEFAULTS.

Every field below is emitted only when it is actually set in values. A chart that
writes out `service.type: ClusterIP` or `accessMode: ReadWriteOnce` — values the
CRD and the operator already default to the same thing — becomes a SECOND source
of defaults: the value is frozen into the object at install time, so when the
operator's default changes in a later release, every chart-installed cluster
silently keeps the old one. Unset means "slaptain decides", which is the same
rule ADR-024 applies to slapd's own tunables.

The operator defaults these twice over, so omission is safe in both directions:
the CRD carries `+kubebuilder:default` (materialised at admission when the parent
object is present) and the controller falls back to the identical value when it
reads an empty field (slapdcluster_controller.go — sizes, access modes, service
type and ports).

Two deliberate exceptions, and they are the only opinions this chart holds:
  * ldap.tls defaults to ENABLED, where the CRD defaults to false. A directory
    server should not ship plaintext-by-default, and the block is always emitted
    so the rendered spec is never empty.
  * persistence.data.size is 5Gi against the operator's 1Gi — deliberately
    lopsided against the 32Gi default map size, and documented as such in
    docs/TUNING.md.
*/}}
apiVersion: ldap.chuck-chuck-chuck.net/v1alpha1
kind: SlapdCluster
metadata:
  name: {{ include "slapd.fullname" . }}
  labels:
    {{- include "slapd.labels" . | nindent 4 }}
spec:
  {{- /* An omitted image is not a missing one: the operator derives each image
         from its OWN image and tag (CloudNativePG-style), which keeps slapd,
         slapd-init and the operator on one version. Pinning a repository or tag
         here overrides that for the field it names. */ -}}
  {{- $si := .Values.images.slapd | default dict -}}
  {{- $ii := .Values.images.init | default dict -}}
  {{- if or $si.repository $si.tag $si.pullPolicy $ii.repository $ii.tag $ii.pullPolicy }}
  images:
    {{- range $k, $img := (dict "slapd" $si "init" $ii) }}
    {{- if or $img.repository $img.tag $img.pullPolicy }}
    {{ $k }}:
      {{- with $img.repository }}
      repository: {{ . | quote }}
      {{- end }}
      {{- with $img.tag }}
      tag: {{ . | quote }}
      {{- end }}
      {{- with $img.pullPolicy }}
      pullPolicy: {{ . }}
      {{- end }}
    {{- end }}
    {{- end }}
  {{- end }}
  ldap:
    {{- if .Values.ldap.cnConfigCredentials.secretName }}
    cnConfigCredentials:
      secretName: {{ .Values.ldap.cnConfigCredentials.secretName | quote }}
    {{- end }}
    tls:
      enabled: {{ .Values.ldap.tls.enabled }}
      {{- if .Values.ldap.tls.enabled }}
      secretName: {{ .Values.ldap.tls.secretName | quote }}
      {{- end }}

  {{- /* Presence-based, not truthiness: `with`/`if` would drop an explicit 0,
         and 0 is meaningful for logLevel (silence slapd) and for
         serverIDBase/readReplicas. kindIs catches `key:` with nothing after it,
         which hasKey reports as present. Same idiom as slapd-mesh's
         serverIDIndex. */ -}}
  {{- range $k := list "replicas" "readReplicas" "logLevel" }}
  {{- if and (hasKey $.Values $k) (not (kindIs "invalid" (index $.Values $k))) }}
  {{ $k }}: {{ index $.Values $k }}
  {{- end }}
  {{- end }}

  {{- $p := .Values.persistence | default dict -}}
  {{- $pc := $p.config | default dict -}}
  {{- $pd := $p.data | default dict -}}
  {{- $pa := $p.accesslog | default dict -}}
  {{- if or $pc $pd $pa }}
  persistence:
    {{- range $k, $v := (dict "config" $pc "data" $pd "accesslog" $pa) }}
    {{- if $v }}
    {{ $k }}:
      {{- with $v.size }}
      size: {{ . | quote }}
      {{- end }}
      {{- with $v.accessMode }}
      accessMode: {{ . }}
      {{- end }}
      {{- with $v.storageClass }}
      storageClass: {{ . | quote }}
      {{- end }}
    {{- end }}
    {{- end }}
  {{- end }}

  {{- $svc := .Values.service | default dict -}}
  {{- if or $svc.type $svc.ldapPort $svc.ldapsPort $svc.annotations }}
  service:
    {{- with $svc.type }}
    type: {{ . }}
    {{- end }}
    {{- with $svc.ldapPort }}
    ldapPort: {{ . }}
    {{- end }}
    {{- with $svc.ldapsPort }}
    ldapsPort: {{ . }}
    {{- end }}
    {{- with $svc.annotations }}
    annotations:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- end }}

  {{- $r := .Values.replication | default dict -}}
  {{- $hasServerIDBase := and (hasKey $r "serverIDBase") (not (kindIs "invalid" $r.serverIDBase)) -}}
  {{- if or $r.enabled $hasServerIDBase $r.mode $r.keepalive $r.retry $r.network $r.externalPeers }}
  replication:
    {{- if $r.enabled }}
    enabled: true
    {{- end }}
    {{- if $hasServerIDBase }}
    serverIDBase: {{ $r.serverIDBase }}
    {{- end }}
    {{- with $r.mode }}
    mode: {{ . | quote }}
    {{- end }}
    {{- with $r.keepalive }}
    keepalive: {{ . | quote }}
    {{- end }}
    {{- with $r.retry }}
    retry: {{ . | quote }}
    {{- end }}
    {{- with $r.network }}
    network:
      {{- with .mode }}
      mode: {{ . | quote }}
      {{- end }}
      {{- with .multusNetwork }}
      multusNetwork: {{ . | quote }}
      {{- end }}
      {{- if .useForInCluster }}
      useForInCluster: true
      {{- end }}
    {{- end }}
    {{- with $r.externalPeers }}
    externalPeers:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- end }}

  {{- with .Values.resources }}
  resources:
    {{- toYaml . | nindent 4 }}
  {{- end }}

  {{- with .Values.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
