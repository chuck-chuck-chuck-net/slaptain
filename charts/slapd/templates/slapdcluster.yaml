apiVersion: ldap.chuck-chuck-chuck.net/v1alpha1
kind: SlapdCluster
metadata:
  name: {{ include "slapd.fullname" . }}
  labels:
    {{- include "slapd.labels" . | nindent 4 }}
spec:
  {{- /* Emitted only for the fields actually set. An omitted image is not a
         missing one: the operator derives each image from its OWN image and tag
         (CloudNativePG-style), which keeps slapd, slapd-init and the operator on
         one version. Pinning a repository/tag here overrides that per field. */}}
  {{- if or .Values.images.slapd.repository .Values.images.slapd.tag .Values.images.slapd.pullPolicy .Values.images.init.repository .Values.images.init.tag .Values.images.init.pullPolicy }}
  images:
    {{- if or .Values.images.slapd.repository .Values.images.slapd.tag .Values.images.slapd.pullPolicy }}
    slapd:
      {{- with .Values.images.slapd.repository }}
      repository: {{ . | quote }}
      {{- end }}
      {{- with .Values.images.slapd.tag }}
      tag: {{ . | quote }}
      {{- end }}
      {{- with .Values.images.slapd.pullPolicy }}
      pullPolicy: {{ . }}
      {{- end }}
    {{- end }}
    {{- if or .Values.images.init.repository .Values.images.init.tag .Values.images.init.pullPolicy }}
    init:
      {{- with .Values.images.init.repository }}
      repository: {{ . | quote }}
      {{- end }}
      {{- with .Values.images.init.tag }}
      tag: {{ . | quote }}
      {{- end }}
      {{- with .Values.images.init.pullPolicy }}
      pullPolicy: {{ . }}
      {{- end }}
    {{- end }}
  {{- end }}

  ldap:
    {{- if .Values.ldap.cnConfigCredentials.secretName }}
    cnConfigCredentials:
      secretName: {{ .Values.ldap.cnConfigCredentials.secretName | quote }}
    {{- end }}
    tls:
      enabled: {{ .Values.ldap.tls.enabled }}
      {{- if .Values.ldap.tls.enabled }}
      secretName: {{ .Values.ldap.tls.secretName | quote }}
      {{- end }}

  replicas: {{ .Values.replicas }}
  {{- if gt (int .Values.readReplicas) 0 }}
  readReplicas: {{ .Values.readReplicas }}
  {{- end }}
  {{- /* Presence-based, not truthiness: `with`/`if` would drop an explicit 0,
         which is the documented way to silence slapd. kindIs catches `logLevel:`
         with nothing after it, which hasKey reports as present.
         Same idiom as charts/slapd-mesh's serverIDIndex. */}}
  {{- if and (hasKey .Values "logLevel") (not (kindIs "invalid" .Values.logLevel)) }}
  logLevel: {{ .Values.logLevel }}
  {{- end }}

  persistence:
    config:
      size: {{ .Values.persistence.config.size | quote }}
      accessMode: {{ .Values.persistence.config.accessMode }}
      {{- if .Values.persistence.config.storageClass }}
      storageClass: {{ .Values.persistence.config.storageClass | quote }}
      {{- end }}
    data:
      size: {{ .Values.persistence.data.size | quote }}
      accessMode: {{ .Values.persistence.data.accessMode }}
      {{- if .Values.persistence.data.storageClass }}
      storageClass: {{ .Values.persistence.data.storageClass | quote }}
      {{- end }}
    accesslog:
      size: {{ .Values.persistence.accesslog.size | quote }}
      accessMode: {{ .Values.persistence.accesslog.accessMode }}
      {{- if .Values.persistence.accesslog.storageClass }}
      storageClass: {{ .Values.persistence.accesslog.storageClass | quote }}
      {{- end }}

  service:
    type: {{ .Values.service.type }}
    ldapPort: {{ .Values.service.ldapPort }}
    ldapsPort: {{ .Values.service.ldapsPort }}

  replication:
    enabled: {{ .Values.replication.enabled }}
    {{- if and (hasKey .Values.replication "serverIDBase") (not (kindIs "invalid" .Values.replication.serverIDBase)) }}
    serverIDBase: {{ .Values.replication.serverIDBase }}
    {{- end }}
    {{- if .Values.replication.mode }}
    mode: {{ .Values.replication.mode | quote }}
    {{- end }}
    {{- if .Values.replication.keepalive }}
    keepalive: {{ .Values.replication.keepalive | quote }}
    {{- end }}
    {{- if .Values.replication.retry }}
    retry: {{ .Values.replication.retry | quote }}
    {{- end }}
    {{- with .Values.replication.network }}
    network:
      {{- if .mode }}
      mode: {{ .mode | quote }}
      {{- end }}
      {{- if .multusNetwork }}
      multusNetwork: {{ .multusNetwork | quote }}
      {{- end }}
      {{- if .useForInCluster }}
      useForInCluster: {{ .useForInCluster }}
      {{- end }}
    {{- end }}
    {{- if .Values.replication.externalPeers }}
    externalPeers:
      {{- toYaml .Values.replication.externalPeers | nindent 6 }}
    {{- end }}

  {{- with .Values.resources }}
  resources:
    {{- toYaml . | nindent 4 }}
  {{- end }}

  {{- with .Values.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
