{{- /*
THE CHART DOES NOT RESTATE THE OPERATOR'S DEFAULTS.

Every field below is emitted only when it is actually set in values. A chart that
writes out `service.type: ClusterIP` or `accessMode: ReadWriteOnce` — values the
CRD and the operator already default to the same thing — becomes a SECOND source
of defaults: the value is frozen into the object at install time, so when the
operator's default changes in a later release, every chart-installed cluster
silently keeps the old one. Unset means "slaptain decides", which is the same
rule ADR-024 applies to slapd's own tunables.

The operator defaults these twice over, so omission is safe in both directions:
the CRD carries `+kubebuilder:default` (materialised at admission when the parent
object is present) and the controller falls back to the identical value when it
reads an empty field (slapdcluster_controller.go — sizes, access modes, service
type and ports).

Two deliberate exceptions, and they are the only opinions this chart holds:
  * ldap.tls defaults to ENABLED, where the CRD defaults to false. A directory
    server should not ship plaintext-by-default, and the block is always emitted
    so the rendered spec is never empty.
  * persistence.data.size is 5Gi against the operator's 1Gi — deliberately
    lopsided against the 32Gi default map size, and documented as such in
    docs/TUNING.md.
*/}}
apiVersion: ldap.chuck-chuck-chuck.net/v1alpha1
kind: SlapdCluster
metadata:
  name: {{ include "slapd.fullname" . }}
  labels:
    {{- include "slapd.labels" . | nindent 4 }}
spec:
  {{- /* An omitted image is not a missing one: the operator derives each image
         from its OWN image and tag (CloudNativePG-style), which keeps slapd,
         slapd-init and the operator on one version. Pinning a repository or tag
         here overrides that for the field it names. */ -}}
  {{- $si := .Values.images.slapd | default dict -}}
  {{- $ii := .Values.images.init | default dict -}}
  {{- $ei := .Values.images.exporter | default dict -}}
  {{- if or $si.repository $si.tag $si.pullPolicy $ii.repository $ii.tag $ii.pullPolicy $ei.repository $ei.tag $ei.pullPolicy }}
  images:
    {{- range $k, $img := (dict "slapd" $si "init" $ii "exporter" $ei) }}
    {{- if or $img.repository $img.tag $img.pullPolicy }}
    {{ $k }}:
      {{- with $img.repository }}
      repository: {{ . | quote }}
      {{- end }}
      {{- with $img.tag }}
      tag: {{ . | quote }}
      {{- end }}
      {{- with $img.pullPolicy }}
      pullPolicy: {{ . }}
      {{- end }}
    {{- end }}
    {{- end }}
  {{- end }}
  ldap:
    {{- if .Values.ldap.cnConfigCredentials.secretName }}
    cnConfigCredentials:
      secretName: {{ .Values.ldap.cnConfigCredentials.secretName | quote }}
    {{- end }}
    tls:
      enabled: {{ .Values.ldap.tls.enabled }}
      {{- if .Values.ldap.tls.enabled }}
      secretName: {{ .Values.ldap.tls.secretName | quote }}
      {{- end }}

  {{- /* Presence-based, not truthiness: `with`/`if` would drop an explicit 0,
         and 0 is meaningful for logLevel (silence slapd) and for
         serverIDBase/readReplicas. kindIs catches `key:` with nothing after it,
         which hasKey reports as present. Same idiom as slapd-mesh's
         serverIDIndex. */ -}}
  {{- range $k := list "replicas" "readReplicas" "logLevel" }}
  {{- if and (hasKey $.Values $k) (not (kindIs "invalid" (index $.Values $k))) }}
  {{ $k }}: {{ index $.Values $k }}
  {{- end }}
  {{- end }}

  {{- $p := .Values.persistence | default dict -}}
  {{- $pc := $p.config | default dict -}}
  {{- $pd := $p.data | default dict -}}
  {{- $pa := $p.accesslog | default dict -}}
  {{- if or $pc $pd $pa }}
  persistence:
    {{- range $k, $v := (dict "config" $pc "data" $pd "accesslog" $pa) }}
    {{- if $v }}
    {{ $k }}:
      {{- with $v.size }}
      size: {{ . | quote }}
      {{- end }}
      {{- with $v.accessMode }}
      accessMode: {{ . }}
      {{- end }}
      {{- with $v.storageClass }}
      storageClass: {{ . | quote }}
      {{- end }}
    {{- end }}
    {{- end }}
  {{- end }}

  {{- $svc := .Values.service | default dict -}}
  {{- if or $svc.type $svc.ldapPort $svc.ldapsPort $svc.annotations }}
  service:
    {{- with $svc.type }}
    type: {{ . }}
    {{- end }}
    {{- with $svc.ldapPort }}
    ldapPort: {{ . }}
    {{- end }}
    {{- with $svc.ldapsPort }}
    ldapsPort: {{ . }}
    {{- end }}
    {{- with $svc.annotations }}
    annotations:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- end }}

  {{- $r := .Values.replication | default dict -}}
  {{- $hasServerIDBase := and (hasKey $r "serverIDBase") (not (kindIs "invalid" $r.serverIDBase)) -}}
  {{- if or $r.enabled $hasServerIDBase $r.mode $r.keepalive $r.retry $r.network $r.externalPeers }}
  replication:
    {{- if $r.enabled }}
    enabled: true
    {{- end }}
    {{- if $hasServerIDBase }}
    serverIDBase: {{ $r.serverIDBase }}
    {{- end }}
    {{- with $r.mode }}
    mode: {{ . | quote }}
    {{- end }}
    {{- with $r.keepalive }}
    keepalive: {{ . | quote }}
    {{- end }}
    {{- with $r.retry }}
    retry: {{ . | quote }}
    {{- end }}
    {{- with $r.replicasPerPeer }}
    replicasPerPeer: {{ . }}
    {{- end }}
    {{- with $r.network }}
    network:
      {{- with .mode }}
      mode: {{ . | quote }}
      {{- end }}
      {{- with .multusNetwork }}
      multusNetwork: {{ . | quote }}
      {{- end }}
      {{- if .useForInCluster }}
      useForInCluster: true
      {{- end }}
    {{- end }}
    {{- with $r.externalPeers }}
    externalPeers:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- end }}

  {{- with .Values.resources }}
  resources:
    {{- toYaml . | nindent 4 }}
  {{- end }}

  {{- with .Values.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}

  {{- with .Values.monitoring }}
  monitoring:
    {{- toYaml . | nindent 4 }}
  {{- end }}

  {{- /* spec.placement (ADR-043). Where this cluster's pods are allowed to
         land. Everything here is a raw Kubernetes type passed through
         verbatim, and the chart adds nothing of its own.

         topologySpreadConstraints is the one key that is NOT written with the
         usual `with`, and the reason is semantic rather than stylistic. The
         operator distinguishes three states, not two: absent means "said
         nothing" and gets the operator's generated per-fleet spread; an
         explicit [] means "said none" and is the ONLY way to switch that
         default off. `with` treats an empty list exactly like an absent one,
         so it would silently drop a user's [] and hand them back the default
         they had just turned off — with no error anywhere to notice it by.

         kindIs "slice" is what tells the three apart: an absent key and an
         explicitly null one are both "invalid" and render nothing (null reads
         as absent, which is also how the API server stores it), while [] and
         a populated list are both slices and are rendered as written. */}}
  {{- $placement := .Values.placement | default dict }}
  {{- $spread := $placement.topologySpreadConstraints }}
  {{- if or (kindIs "slice" $spread) $placement.nodeSelector $placement.nodeAffinity $placement.tolerations $placement.priorityClassName }}
  placement:
    {{- if kindIs "slice" $spread }}
    {{- if $spread }}
    topologySpreadConstraints:
      {{- toYaml $spread | nindent 6 }}
    {{- else }}
    topologySpreadConstraints: []
    {{- end }}
    {{- end }}
    {{- with $placement.nodeSelector }}
    nodeSelector:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with $placement.nodeAffinity }}
    nodeAffinity:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with $placement.tolerations }}
    tolerations:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with $placement.priorityClassName }}
    priorityClassName: {{ . | quote }}
    {{- end }}
  {{- end }}

  {{- /* spec.accesslogPurge (form A) and spec.rotation (form B) — ADR-024 R6.
         WHEN the purge runs is the cluster's, in one of two mutually exclusive
         forms; WHAT each database keeps stays on the SlapdDatabase.

         The chart renders whatever is set and leaves the refusal to the
         operator, which reports it as RotationConfigured=False/
         ScheduleDeclaredTwice. Refusing here would be a second authority with
         a worse message and no view of spec.replicas.

         Spelled out field by field rather than passed through with toYaml,
         for two reasons:

         * every duration must reach the API server as a STRING. The CRD
           renders metav1.Duration as a bare `type: string`, so
           `--set rotation.slotLength=90` would otherwise be sent as a number
           and rejected as a type error rather than as the duration it is not.
           Quoting makes the CEL rule — which checks the Go duration grammar —
           the thing that answers.
         * enabled and slotsFromWriteToPurge must survive their meaningful
           falsy values. `enabled: false` is NOT the same as unset once the
           default moves (the CRD field is a pointer for exactly that reason),
           and `slotsFromWriteToPurge: 0` is the write landing on the purging
           pod, which the OPERATOR must refuse by name — dropping it here would
           turn a reported fault into a silent default of 1.

         The chart restates none of the operator's defaults: there is no
         slotLength default to restate (there is deliberately none), and
         neither the 24h interval nor v's 1 belongs in a values file that
         would then have to be edited when either moves. */ -}}
  {{- $purge := .Values.accesslogPurge | default dict -}}
  {{- with $purge.interval }}
  accesslogPurge:
    interval: {{ . | quote }}
  {{- end }}
  {{- $rot := .Values.rotation | default dict -}}
  {{- $hasRotEnabled := and (hasKey $rot "enabled") (not (kindIs "invalid" $rot.enabled)) -}}
  {{- $hasSlots := and (hasKey $rot "slotsFromWriteToPurge") (not (kindIs "invalid" $rot.slotsFromWriteToPurge)) -}}
  {{- if or $hasRotEnabled $rot.slotLength $hasSlots $rot.leadTime $rot.mode }}
  rotation:
    {{- if $hasRotEnabled }}
    enabled: {{ $rot.enabled }}
    {{- end }}
    {{- /* mode is rendered even though the charts recommend only the coupled
           default, because the alternative is worse: kubectl explain tells
           people the field exists, and a value set here that the template did
           not know about would be silently dropped. Unset renders nothing and
           the operator reads it as PurgeAndWrite. */ -}}
    {{- with $rot.mode }}
    mode: {{ . | quote }}
    {{- end }}
    {{- with $rot.slotLength }}
    slotLength: {{ . | quote }}
    {{- end }}
    {{- if $hasSlots }}
    slotsFromWriteToPurge: {{ $rot.slotsFromWriteToPurge }}
    {{- end }}
    {{- /* leadTime needs no falsy guard: unset and "0s" MEAN the same thing —
           the endpoint moving at the boundary — so there is no value the
           operator must be told about that `with` would swallow. Quoted for
           the same reason slotLength is. */ -}}
    {{- with $rot.leadTime }}
    leadTime: {{ . | quote }}
    {{- end }}
  {{- end }}
