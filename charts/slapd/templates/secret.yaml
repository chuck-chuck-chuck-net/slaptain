{{- if not .Values.ldap.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "slapd.fullname" . }}-passwords
  labels:
    {{- include "slapd.labels" . | nindent 4 }}
type: Opaque
data:
  admin-password-hash: {{ .Values.ldap.adminPasswordHash | b64enc | quote }}
  root-password-hash: {{ .Values.ldap.rootPasswordHash | b64enc | quote }}
{{- end }}
