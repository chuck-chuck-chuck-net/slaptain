apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "slapd.fullname" . }}
  labels:
    {{- include "slapd.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "slapd.fullname" . }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "slapd.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "slapd.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      initContainers:
        - name: init
          image: "{{ .Values.global.registry }}/{{ .Values.global.project }}/{{ .Values.image.init.repository }}:{{ .Values.image.init.tag }}"
          imagePullPolicy: {{ .Values.image.init.pullPolicy }}
          env:
            - name: LDAP_DOMAIN_DC
              value: {{ .Values.ldap.domain | quote }}
            {{- $secretName := (default (printf "%s-passwords" (include "slapd.fullname" .)) .Values.ldap.existingSecret) }}
            - name: LDAP_ADMIN_PW_HASH
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: admin-password-hash
            - name: LDAP_ROOT_PW_HASH
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: root-password-hash
            - name: LDAP_TLS_ENABLED
              value: {{ .Values.ldap.tls.enabled | quote }}
            - name: FORCE_REBOOTSTRAP
              value: {{ .Values.ldap.forceRebootstrap | quote }}
            - name: CONFIG_DIR
              value: "/ldap-config"
            - name: DATA_DIR
              value: "/ldap-data"
            {{- if .Values.ldap.tls.enabled }}
            - name: LDAP_TLS_CACERT_PATH
              value: "/etc/openldap/tls/ca.crt"
            - name: LDAP_TLS_CERT_PATH
              value: "/etc/openldap/tls/tls.crt"
            - name: LDAP_TLS_KEY_PATH
              value: "/etc/openldap/tls/tls.key"
            {{- end }}
          volumeMounts:
            - name: ldap-config
              mountPath: /ldap-config
            - name: ldap-data
              mountPath: /ldap-data
            {{- if .Values.ldap.tls.enabled }}
            - name: ldap-tls
              mountPath: /etc/openldap/tls
              readOnly: true
            {{- end }}
      containers:
        - name: slapd
          image: "{{ .Values.global.registry }}/{{ .Values.global.project }}/{{ .Values.image.slapd.repository }}:{{ .Values.image.slapd.tag }}"
          imagePullPolicy: {{ .Values.image.slapd.pullPolicy }}
          args:
            - "-h"
            - "ldap://:1024/ ldaps://:1025/ ldapi://%2frun%2fopenldap%2fslapd.ldapi"
            - "-d"
            - {{ .Values.slapd.logLevel | toString | quote }}
            - "-F"
            - "/ldap-config"
          ports:
            - name: ldap
              containerPort: 1024
              protocol: TCP
            - name: ldaps
              containerPort: 1025
              protocol: TCP
          volumeMounts:
            - name: ldap-config
              mountPath: /ldap-config
            - name: ldap-data
              mountPath: /ldap-data
            - name: ldap-run
              mountPath: /run/openldap
            {{- if .Values.ldap.tls.enabled }}
            - name: ldap-tls
              mountPath: /etc/openldap/tls
              readOnly: true
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: ldap-config
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "slapd.fullname" . }}-config
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: ldap-data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "slapd.fullname" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: ldap-run
          emptyDir: {}
        {{- if .Values.ldap.tls.enabled }}
        - name: ldap-tls
          secret:
            secretName: {{ .Values.ldap.tls.secretName }}
        {{- end }}
