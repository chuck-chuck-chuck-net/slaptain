ldap:
  # domain: "dc=as8,dc=lab,dc=test"
  domain: "dc=chuck-chuck-chuck,dc=net"
  # existingSecret: "my-ldap-secrets"
  tls:
    enabled: true
    secretName: "slapd-tls"
  # ACL rules applied by the operator to every pod's cn=config.
  # The readpw-specific rules below extend the default ACLs:
  #   {0} restrict userPassword in ou=Mail to self-write + readpw-read + anon-auth
  #   {1} hide userPassword everywhere else (anon may auth but not read)
  #   {2} allow self-write on shadowLastChange
  #   {3} allow all other reads to everyone
  acls:
    - 'to dn.subtree="ou=Mail,dc=chuck-chuck-chuck,dc=net" attrs=userPassword by self write by dn.children="ou=Readpw,dc=chuck-chuck-chuck,dc=net" read by anonymous auth by * none'
    - 'to attrs=userPassword by self write by anonymous auth by * none'
    - 'to attrs=shadowLastChange by self write by * read'
    - 'to * by * read'

# passwords:
#   adminPassword: "..."  # plaintext; slappasswd hash is computed at runtime by init container
#   rootPassword: "..."

# slapd -d log level. 0 = no debug output. See slapd(8) for levels.
logLevel: 256

replicas: 3
readReplicas: 1
replication:
  enabled: true
