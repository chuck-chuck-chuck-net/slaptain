# Namespace-scoped RBAC for the in-cluster e2e test runner Job.
#
# Applied by `make e2e-in-cluster`, which substitutes __NAMESPACE_TESTING__
# before piping through kubectl apply.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: e2e-runner
  namespace: __NAMESPACE_TESTING__
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: e2e-runner
  namespace: __NAMESPACE_TESTING__
rules:
  # Pod inspection and deletion — used by resilience tests.
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch, delete]
  # Secret reading — admin/root/readpw passwords in BeforeSuite.
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, watch]
  # StatefulSet status — statefulSetReady() helper.
  - apiGroups: [apps]
    resources: [statefulsets]
    verbs: [get, list, watch]
  # Deployment status — deploymentReady() helper.
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch]
  # Job status — jobSucceeded() helper (bootstrap Job check in BeforeSuite).
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch]
  # Service / PVC — future tests.
  - apiGroups: [""]
    resources: [services, persistentvolumeclaims]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: e2e-runner
  namespace: __NAMESPACE_TESTING__
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: e2e-runner
subjects:
  - kind: ServiceAccount
    name: e2e-runner
    namespace: __NAMESPACE_TESTING__
