# In-cluster e2e test runner Job.
#
# Applied by `make e2e-in-cluster`, which substitutes the two placeholders:
#   __E2E_RUNNER_IMAGE__   — e.g. ghcr.io/chuck-chuck-chuck-net/slaptain/e2e-runner:latest
#   __NAMESPACE_TESTING__  — e.g. slaptain-testing
#
# The Job runs the compiled Ginkgo binary in the cluster so tests can reach
# slapd directly via ClusterIP (LDAP_ADDR) and per-pod via headless DNS
# (dialPodLDAP), without any kubectl port-forward subprocess.
apiVersion: batch/v1
kind: Job
metadata:
  name: e2e-runner
  namespace: __NAMESPACE_TESTING__
spec:
  backoffLimit: 0
  template:
    spec:
      serviceAccountName: e2e-runner
      restartPolicy: Never
      containers:
        - name: e2e-runner
          image: __E2E_RUNNER_IMAGE__
          imagePullPolicy: IfNotPresent
          args:
            - "--ginkgo.v"
            - "-test.v"
            - "--ginkgo.timeout=30m"
          env:
            - name: NAMESPACE_TESTING
              value: __NAMESPACE_TESTING__
            # Skip kubectl port-forward; reach slapd directly via ClusterIP.
            - name: LDAP_ADDR
              value: slapd.__NAMESPACE_TESTING__.svc.cluster.local:389
            # Headless service for per-pod DNS (replication + resilience tests).
            - name: LDAP_HEADLESS_SVC
              value: slapd-headless
            # Always run resilience tests in-cluster (port-forward issues gone).
            - name: E2E_RESILIENCE
              value: "1"
