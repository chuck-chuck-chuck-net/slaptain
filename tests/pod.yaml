apiVersion: v1
kind: Pod
metadata:
  labels:
    run: slapd-test
  name: slapd-test
spec:
  containers:
  - args:
    - sleep
    - infinity
    image: python:3.14-trixie
    name: slapd-test
    volumeMounts:
    - mountPath: /config
      name: cm
      readOnly: true
  volumes:
  - configMap:
      defaultMode: 420
      name: slapd-test
    name: cm
