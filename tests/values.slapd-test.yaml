# OX-specific slapd-test overrides.
# Apply on top of the chart defaults:
#   helm upgrade --install slapd-test ./charts/slapd-test \
#     -f tests/values.slapd-test.yaml \
#     -f tests/values.slapd-test.secret.yaml
#
# Note on Helm template expressions in values files:
# Some string values below (e.g. ousJson) contain {{ }} expressions.  This is
# intentional and works because the chart's configmap.yaml passes these strings
# through Helm's `tpl` function at render time:
#
#   {{ tpl .Values.bootstrap.ousJson . | indent 4 }}
#
# Values files are plain YAML — Helm reads them without any template processing,
# so {{ }} are stored as literal characters.  The substitution happens only later,
# inside the template, when `tpl` is invoked.  The source of the string (chart
# default values.yaml vs. a -f override file) makes no difference to `tpl`.

slapd:
  fullname: slapd
  # domain: "dc=as8,dc=lab,dc=test"
  domain: "dc=chuck-chuck-chuck,dc=net"
  # In operator mode passwords live in the operator-managed secrets; don't duplicate them.
  passwordsSecretName: slapd-passwords
  configPasswordSecretName: slapd-config-password

persistence:
  volumeClaimRetentionPolicy:
    whenDeleted: Delete
    whenScaled: Retain

  # OUs: standard set (Readpw, People, Mail) plus the OX SecondaryAccount OU.
  ousJson: |
    [
      {"changetype":"add","dn":"ou={{ .Values.bootstrap.readpwOU }},{{ .Values.slapd.domain }}","objectClass":["organizationalUnit"],"attributes":[]},
      {"changetype":"add","dn":"ou=People,{{ .Values.slapd.domain }}","objectClass":["organizationalUnit"],"attributes":[]},
      {"changetype":"add","dn":"ou=Mail,{{ .Values.slapd.domain }}","objectClass":["organizationalUnit"],"attributes":[]},
      {"changetype":"add","dn":"ou=SecondaryAccount,{{ .Values.slapd.domain }}","objectClass":["organizationalUnit"],"attributes":[]}
    ]
